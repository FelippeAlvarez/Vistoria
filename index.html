<style>
:root{--bg:#f3f5f9;--card:#fff;--ink:#0f172a;--muted:#64748b;--line:#e2e8f0;--pri:#1d4ed8;--pri-2:#1e3a8a;--pri-soft:#e8efff;--danger:#b91c1c;--chip:#eef2f7;
  --ok:#15803d;--alerta:#b45309;--sombra:0 1px 2px rgba(15,23,42,.05),0 6px 18px rgba(15,23,42,.06);color-scheme:light}
/* tema escuro: automático (segue o aparelho) ou escolhido em Configurações → Aparência */
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0b1118;--card:#141c27;--ink:#e5ebf3;--muted:#93a1b5;--line:#243142;--pri:#3b82f6;--pri-2:#1e3a8a;--pri-soft:#172554;--danger:#f87171;--chip:#1c2836;--ok:#4ade80;--alerta:#fbbf24;--sombra:0 1px 2px rgba(0,0,0,.35);color-scheme:dark}}
:root[data-theme=dark]{--bg:#0b1118;--card:#141c27;--ink:#e5ebf3;--muted:#93a1b5;--line:#243142;--pri:#3b82f6;--pri-2:#1e3a8a;--pri-soft:#172554;--danger:#f87171;--chip:#1c2836;--ok:#4ade80;--alerta:#fbbf24;--sombra:0 1px 2px rgba(0,0,0,.35);color-scheme:dark}
/* fonte Inter (licença SIL OFL 1.1), guardada no aplicativo para funcionar sem internet */
@font-face{font-family:"Inter";src:url(lib/fontes/inter-latin.woff2) format("woff2");font-weight:100 900;font-style:normal;font-display:swap}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
.ic{width:1.2em;height:1.2em;flex:none;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.22em}
header{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line);padding:10px 16px;padding-top:max(10px,env(safe-area-inset-top));display:flex;gap:10px;align-items:center;min-height:52px}
header h1{font-size:17px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.voltar{font-size:22px;line-height:1;text-decoration:none;color:var(--ink);padding:4px 10px 6px;border-radius:8px;border:1px solid var(--line)}
#status{font-size:13px;color:var(--muted);text-align:right}
header.sem-topo{display:none}
a.btn{text-decoration:none}
/* tela inicial */
.saudacao{margin:4px 0 16px;color:var(--muted)}
.menu{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;margin-bottom:16px}
.tile{display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;font:inherit;color:var(--ink);text-decoration:none;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;cursor:pointer;min-height:112px}
.tile:hover{border-color:var(--pri)}
.tile .ico{font-size:26px;line-height:1.2}
.tile strong{font-size:15px}
.tile small{color:var(--muted);font-size:13px}
.tile.primary{background:var(--pri);border-color:var(--pri);color:#fff}
.tile.primary small{color:rgba(255,255,255,.85)}
/* tutorial: primeiro botão do menu, ocupando a linha inteira */
.tile.tutorial{grid-column:1/-1;min-height:0;display:grid;grid-template-columns:auto 1fr;column-gap:12px;align-items:center;background:var(--chip);border-color:var(--pri)}
.tile.tutorial .ico{grid-row:span 2;font-size:30px}
.tile.largo{grid-column:1/-1;min-height:0;display:grid;grid-template-columns:auto 1fr;column-gap:12px;align-items:center}
.tile.largo .ico{grid-row:span 2;font-size:30px}
/* nome do aplicativo no alto da tela inicial */
.marca{max-width:640px;display:flex;align-items:center;justify-content:center;gap:16px;margin:10px 0 20px}
.marca-simbolo{width:84px;height:84px;flex:none}
.marca-nome{font-size:46px;font-weight:600;letter-spacing:3px;line-height:1;color:var(--pri)}
.marca-sub{font-size:13px;font-weight:500;letter-spacing:3.5px;color:var(--muted);margin-top:8px}
@media (max-width:380px){.marca-simbolo{width:70px;height:70px}.marca-nome{font-size:38px}.marca-sub{font-size:11.5px;letter-spacing:2.5px}}
/* tela inicial: todos os botões no formato do "Novo laudo" (largura total, ícone à esquerda, mesma altura) */
.menu{grid-template-columns:1fr;max-width:640px}
.menu .tile{grid-column:1/-1;min-height:96px;display:grid;grid-template-columns:44px 1fr;column-gap:12px;align-items:center;padding:14px 16px}
.menu .tile .ico{grid-row:span 2;font-size:30px;text-align:center}
/* escolha do tipo de laudo */
.tipos{display:grid;grid-template-columns:1fr;gap:6px;max-width:640px}
.tile.tipo{min-height:0;width:100%;display:grid;grid-template-columns:44px 1fr;column-gap:14px;align-items:center;box-shadow:var(--sombra);border-radius:16px}
.tile.tipo .bolha{grid-row:span 2;width:44px;height:44px}
.link-tipo{font-size:13px;margin:0 0 10px 4px}
/* lembrete de backup */
.aviso-backup{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;border-color:#d97706;background:color-mix(in srgb,#f59e0b 10%,var(--card))}
/* janela (enviar para edição) */
.modal{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:16px}
.modal-caixa{background:var(--card);color:var(--ink);border-radius:14px;padding:18px;max-width:460px;width:100%;max-height:90vh;overflow:auto;box-shadow:0 10px 30px rgba(0,0,0,.3)}
.modal-caixa h2{margin-top:0}
.modal-botoes{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.modal-botoes .btn{justify-content:center;padding:12px}
/* tutorial */
.tutorial-txt{line-height:1.6;scroll-margin-top:64px}
.tutorial-txt h2{font-size:17px}
.tutorial-txt h3{border-top:0;padding-top:0;margin:18px 0 6px;font-size:15px}
.tutorial-txt li{margin-bottom:4px}
.tutorial-txt ol,.tutorial-txt ul{padding-left:22px}
.indice{display:flex;flex-wrap:wrap;gap:6px}
.link-tutorial{font-size:13px;margin:-8px 0 12px;text-align:right}
/* barra de ações da vistoria */
.acoes{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:16px}
.sel-fotos{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px;margin-top:10px;max-height:42vh;overflow:auto}
.sel-foto{position:relative;display:block;font-size:12px;color:var(--muted);cursor:pointer}
.sel-foto img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;display:block}
.sel-foto input{position:absolute;top:6px;left:6px;width:20px;height:20px}
.sel-foto span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acoes .btn{justify-content:center}
.aviso{background:var(--chip);border-radius:8px;padding:10px 12px;font-size:14px}
.busca{margin-bottom:8px}
.rodape{margin:28px 0 8px;padding-top:14px;border-top:1px solid var(--line);text-align:center;font-size:12px;line-height:1.6;color:var(--muted)}
.rodape a{color:var(--pri);font-weight:600}
.rodape .lk{background:none;border:0;padding:0;font:inherit;color:var(--muted);text-decoration:underline;cursor:pointer}
.termos{line-height:1.6}
.termos h2{font-size:17px}
.termos h3{border-top:0;padding-top:0;margin:22px 0 6px;font-size:15px}
.termos p,.termos li{text-align:justify}
.termos ol{padding-left:22px}
.termos .destaque{background:var(--chip);border-radius:8px;padding:10px 12px}
.aceite{display:flex;flex-direction:column;gap:14px;position:sticky;bottom:12px;box-shadow:0 4px 18px rgba(0,0,0,.15)}
.check{flex-direction:row;align-items:flex-start;gap:10px;font-size:15px;color:var(--ink);cursor:pointer}
.check input{width:22px;height:22px;flex:none;margin:1px 0 0}
.aceite .btn{justify-content:center;padding:12px}
.aceite .btn:disabled{opacity:.45;cursor:not-allowed}
.tag{display:inline-block;font-size:11px;border-radius:999px;padding:1px 8px;background:var(--chip);color:var(--muted);margin-left:6px}
@media (max-width:600px){
  main{padding:12px}
  .menu{gap:10px}
  .tile{padding:14px}
  .acoes{grid-template-columns:1fr 1fr}
  .acoes .btn:last-child{grid-column:1/-1}
}
main{max-width:960px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px}
h2{font-size:16px;margin:0 0 12px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.full{grid-column:1/-1}
label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
input,select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 10px;width:100%}
textarea{resize:vertical}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.between{justify-content:space-between}
.btn{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:8px 14px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.btn.primary{background:var(--pri);border-color:var(--pri);color:#fff}
.btn.danger{color:var(--danger)}
.toolbar{margin-bottom:16px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;border-bottom:1px solid var(--line);margin-bottom:12px}
.tab{flex:none;font:inherit;font-size:14px;border:1px solid var(--line);background:var(--chip);color:var(--ink);border-radius:8px;padding:8px 12px;cursor:pointer}
.tab.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.tab.add{background:transparent;border-style:dashed}
.badge{font-size:11px;opacity:.8}
.presets{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.chip{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--chip);color:var(--ink);border-radius:999px;padding:6px 12px;cursor:pointer}
.painel{display:flex;flex-direction:column;gap:14px}
.fotos{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
figure{margin:0;position:relative;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--bg)}
figure img{width:100%;height:140px;object-fit:cover;display:block}
figure input{border:0;border-top:1px solid var(--line);border-radius:0;font-size:13px}
.foto-data{position:absolute;left:6px;top:6px;background:rgba(0,0,0,.6);color:#fff;font-size:11px;padding:2px 6px;border-radius:6px}
figure .legenda{display:flex;align-items:stretch;border-top:1px solid var(--line)}
figure .legenda input{border-top:0;min-width:0}
/* partes (locadores, locatários, fiadores) */
.parte{border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:10px;display:flex;flex-direction:column;gap:10px}
.parte-topo .btn{padding:4px 10px;font-size:13px}
.end-repetido{margin:0;font-size:14px}
/* ditado por voz */
.voz{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.voz-status{font-size:13px;color:var(--muted)}
.mic.gravando{background:var(--danger);border-color:var(--danger);color:#fff;animation:pulsar 1.2s ease-in-out infinite}
.mic.mini{border:0;border-left:1px solid var(--line);border-radius:0;padding:0 10px;font-size:16px;background:var(--bg)}
.mic.mini.gravando{background:var(--danger)}
@keyframes pulsar{50%{opacity:.6}}
.x{position:absolute;top:6px;right:6px;width:28px;height:28px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;font-size:18px;line-height:1;cursor:pointer}
.lista{list-style:none;margin:0;padding:0}
.lista li{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:12px 0;border-top:1px solid var(--line)}
.lista small{display:block;color:var(--muted)}
.muted{color:var(--muted)}
.previa{position:fixed;inset:0;z-index:50;background:#525659;display:flex;flex-direction:column}
.previa-barra{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 16px;background:var(--card);border-bottom:1px solid var(--line)}
.previa-paginas{flex:1;overflow:auto;padding:12px;display:flex;flex-direction:column;align-items:center;gap:12px}
.previa-paginas canvas{background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.35);max-width:100%}
.previa-paginas .muted{color:#eee}
@media (max-width:600px){
  .previa-barra{padding:8px}
  .previa-barra strong{display:none}
  .previa-barra .row{width:100%;flex-wrap:nowrap;gap:6px}
  .previa-barra .btn{flex:1;justify-content:center;padding:8px 6px;font-size:13px}
  .previa-paginas{padding:8px}
}
h2 small{font-weight:400;font-size:13px}
.cabecalho{display:flex;gap:16px;flex-wrap:wrap;align-items:flex-start}
.cabecalho .grid{flex:1;min-width:240px}
h3{font-size:14px;margin:20px 0 10px;padding-top:14px;border-top:1px solid var(--line)}
/* endereço: rua | nº ; complemento | bairro ; cidade | UF */
.g-end{display:grid;grid-template-columns:repeat(6,1fr);gap:12px}
.g-end .c-rua{grid-column:span 5}
.g-end .c-num{grid-column:span 1}
.g-end .c-meio{grid-column:span 3}
input.uf{text-transform:uppercase;text-align:center}
/* partes: nome | CPF/CNPJ, sempre na mesma coluna */
.g-partes{display:grid;grid-template-columns:2fr 1fr;gap:12px}
@media (max-width:600px){
  .g-end{grid-template-columns:1fr 90px}
  .g-end .c-rua{grid-column:1}
  .g-end .c-num{grid-column:2}
  .g-end .c-meio{grid-column:1/-1}
  .g-partes{grid-template-columns:1fr}
  .g-partes span{display:none}
}
/* registro de local e hora */
.geo-reg{display:grid;grid-template-columns:minmax(0,260px) minmax(0,1fr);gap:14px;border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px;background:var(--bg)}
.geo-mapa{width:100%;aspect-ratio:16/10;object-fit:cover;border-radius:8px;border:1px solid var(--line);display:block}
.geo-mapa.grande{margin-bottom:10px}
.geo-sem-mapa{display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:13px;background:var(--chip)}
.geo-info dl,.geo-dl{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;margin:8px 0 10px;font-size:13px}
.geo-info dt,.geo-dl dt{color:var(--muted)}
.geo-info dd,.geo-dl dd{margin:0;overflow-wrap:anywhere}
.ok{color:var(--ok)}.alerta{color:var(--alerta)}
.foto-local{position:absolute;left:6px;top:112px;background:rgba(0,0,0,.62);color:#fff;font-size:11px;padding:2px 6px;border-radius:6px}
@media (max-width:600px){.geo-reg{grid-template-columns:1fr}}
.logo-box{width:160px;height:90px;border:1px dashed var(--line);border-radius:8px;display:flex;align-items:center;justify-content:center;background:#fff;overflow:hidden}
.logo-box img{max-width:100%;max-height:100%;object-fit:contain}

/* ===== Visual 3.0: superfícies, botões e cabeçalho ===== */
.card{border:1px solid var(--line);border-radius:16px;box-shadow:var(--sombra);padding:18px}
h2{font-size:17px;font-weight:650;letter-spacing:-.01em}
h3{font-weight:650}
.btn{border-radius:10px;font-weight:500;transition:background .15s,border-color .15s,transform .05s}
.btn:active{transform:scale(.98)}
.btn:hover{border-color:color-mix(in srgb,var(--pri) 45%,var(--line))}
.btn.primary{background:var(--pri);box-shadow:0 1px 2px rgba(29,78,216,.25)}
.btn.primary:hover{background:color-mix(in srgb,var(--pri) 88%,#000)}
input,select,textarea{border-radius:10px;background:var(--card)}
input:focus,select:focus,textarea:focus{outline:2px solid color-mix(in srgb,var(--pri) 40%,transparent);outline-offset:0;border-color:var(--pri)}
header{background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:saturate(1.4) blur(8px);-webkit-backdrop-filter:saturate(1.4) blur(8px);box-shadow:0 1px 0 var(--line)}
header h1{font-weight:650;letter-spacing:-.01em}
.voltar{display:flex;align-items:center;justify-content:center;width:38px;height:38px;padding:0;border-radius:10px;font-size:20px}
.aviso{border:1px solid var(--line)}
/* cores por tipo de laudo */
.cor-azul{--c:#1d4ed8;--cs:#dbeafe}.cor-verde{--c:#15803d;--cs:#dcfce7}.cor-roxo{--c:#7c3aed;--cs:#ede9fe}.cor-laranja{--c:#c2410c;--cs:#ffedd5}.cor-teal{--c:#0f766e;--cs:#ccfbf1}.cor-cinza{--c:#475569;--cs:#e2e8f0}.cor-ambar{--c:#b45309;--cs:#fef3c7}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) :is(.cor-azul,.cor-verde,.cor-roxo,.cor-laranja,.cor-teal,.cor-cinza,.cor-ambar){--cs:color-mix(in srgb,var(--c) 22%,#141c27)}
  :root:not([data-theme=light]) .cor-azul{--c:#60a5fa}:root:not([data-theme=light]) .cor-verde{--c:#4ade80}:root:not([data-theme=light]) .cor-roxo{--c:#a78bfa}:root:not([data-theme=light]) .cor-laranja{--c:#fb923c}:root:not([data-theme=light]) .cor-teal{--c:#2dd4bf}:root:not([data-theme=light]) .cor-cinza{--c:#94a3b8}:root:not([data-theme=light]) .cor-ambar{--c:#fbbf24}}
:root[data-theme=dark] :is(.cor-azul,.cor-verde,.cor-roxo,.cor-laranja,.cor-teal,.cor-cinza,.cor-ambar){--cs:color-mix(in srgb,var(--c) 22%,#141c27)}
:root[data-theme=dark] .cor-azul{--c:#60a5fa}:root[data-theme=dark] .cor-verde{--c:#4ade80}:root[data-theme=dark] .cor-roxo{--c:#a78bfa}:root[data-theme=dark] .cor-laranja{--c:#fb923c}:root[data-theme=dark] .cor-teal{--c:#2dd4bf}:root[data-theme=dark] .cor-cinza{--c:#94a3b8}:root[data-theme=dark] .cor-ambar{--c:#fbbf24}
.bolha{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;background:var(--cs);color:var(--c);flex:none;font-size:19px}
.etiqueta{display:inline-block;font-size:11.5px;font-weight:600;border-radius:6px;padding:2px 7px;background:var(--cs);color:var(--c)}

/* ===== tela inicial ===== */
.hero{margin:-16px -16px 0;padding:22px 20px 46px;padding-top:max(22px,calc(env(safe-area-inset-top) + 14px));background:#1d4ed8;color:#fff;border-radius:0 0 22px 22px}
.hero-topo{display:flex;align-items:center;gap:12px}
.hero-logo{width:46px;height:46px;border-radius:13px;background:#fff;display:flex;align-items:center;justify-content:center;flex:none;box-shadow:0 2px 8px rgba(0,0,0,.18)}
.hero-logo img{width:36px;height:36px}
.hero-nome{font-size:24px;font-weight:700;letter-spacing:3px;line-height:1}
.hero-sub{font-size:10.5px;letter-spacing:2.6px;opacity:.82;margin-top:5px;font-weight:500}
.hero-ola{font-size:19px;font-weight:600;margin:22px 0 2px;letter-spacing:-.01em}
.hero-resumo{margin:0;opacity:.85;font-size:14px}
.home{max-width:680px;margin:-30px auto 0;position:relative;display:flex;flex-direction:column;gap:12px}
.acao-principal{display:flex;align-items:center;gap:14px;background:var(--card);border-radius:16px;padding:16px;box-shadow:0 6px 24px rgba(15,23,42,.14);text-decoration:none;color:var(--ink);border:1px solid var(--line)}
.acao-principal .bolha{background:var(--pri);color:#fff;width:46px;height:46px;font-size:22px}
.acao-principal strong{font-size:16px;display:block}
.acao-principal small,.atalho small,.tile-tut small{color:var(--muted);font-size:13px}
.acao-principal>.ic,.tile-tut>.ic{margin-left:auto;color:var(--muted)}
.atalhos{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.atalho{display:flex;flex-direction:column;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;text-decoration:none;color:var(--ink);box-shadow:var(--sombra);min-height:116px}
.atalho strong{font-size:14.5px;line-height:1.25}
.atalho:hover,.acao-principal:hover,.tile-tut:hover,.laudo:hover{border-color:color-mix(in srgb,var(--pri) 45%,var(--line))}
.tile-tut{display:flex;align-items:center;gap:12px;background:var(--pri-soft);border:1px solid color-mix(in srgb,var(--pri) 25%,var(--line));border-radius:16px;padding:14px;text-decoration:none;color:var(--ink)}
.tile-tut strong{display:block}
.sec-tit{font-size:13px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:10px 2px 0}
.progresso{height:5px;border-radius:9px;background:var(--chip);overflow:hidden;margin-top:6px}
.progresso i{display:block;height:100%;background:var(--pri);border-radius:9px}


/* ===== lista de laudos em cartões ===== */
.filtros{display:flex;gap:6px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
.filtros .chip.on{background:var(--pri);border-color:var(--pri);color:#fff}
.busca-box{position:relative;margin-bottom:10px}
.busca-box .ic{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted)}
.busca-box input{padding-left:38px}
.laudos{display:flex;flex-direction:column;gap:10px}
.laudo{display:grid;grid-template-columns:64px minmax(0,1fr);gap:12px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;box-shadow:var(--sombra)}
.laudo-capa{width:64px;height:64px;border-radius:12px;object-fit:cover;display:flex;align-items:center;justify-content:center;background:var(--cs);color:var(--c);font-size:26px;text-decoration:none}
.laudo-tit{display:block;font-weight:600;margin:3px 0 1px;color:var(--ink);text-decoration:none;overflow-wrap:anywhere}
.laudo-meta{font-size:13px;color:var(--muted)}
.laudo-acoes{grid-column:1/-1;display:flex;gap:6px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:10px}
.laudo-acoes .btn{padding:6px 11px;font-size:13px}
.laudo-acoes details{position:relative}
.laudo-acoes summary{list-style:none}
.laudo-acoes summary::-webkit-details-marker{display:none}
.menu-mais{position:absolute;z-index:8;right:0;top:calc(100% + 6px);background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 30px rgba(15,23,42,.18);padding:6px;display:flex;flex-direction:column;min-width:210px}
.menu-mais .btn{border:0;justify-content:flex-start;box-shadow:none;background:transparent}
.menu-mais .btn:hover{background:var(--chip)}
.laudo-acoes details:last-child .menu-mais{right:0}
.vazio{text-align:center;padding:28px 12px}
.vazio .bolha{margin:0 auto 10px;width:56px;height:56px;font-size:26px}

/* ===== editor: etapas, ações e cômodos ===== */
.etapas{position:sticky;top:52px;z-index:4;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);margin:-16px -16px 12px;padding:10px 16px 8px;display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.etapa{font:inherit;background:none;border:0;padding:0;text-align:left;cursor:pointer;color:var(--muted);font-size:12px;font-weight:500}
.etapa i{display:block;height:5px;border-radius:9px;background:var(--line);margin-bottom:5px}
.etapa.ok{color:var(--ink)}.etapa.ok i{background:var(--pri)}
.etapa.parcial i{background:linear-gradient(90deg,var(--pri) 50%,var(--line) 50%)}
.acoes{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.acoes .btn{flex:1 1 auto;justify-content:center;padding:10px 12px}
.acoes .btn span.rot-curto{display:none}
.tabs{border-bottom:0;gap:8px;padding-bottom:4px}
.tab{border-radius:999px;padding:7px 13px;background:var(--card);display:inline-flex;align-items:center;gap:6px;font-weight:500}
.tab .badge{opacity:1;background:var(--chip);color:var(--muted);border-radius:999px;padding:0 7px;font-size:11.5px;font-weight:600}
.tab.on .badge{background:rgba(255,255,255,.22);color:#fff}
.estados{display:flex;gap:6px;flex-wrap:wrap}
.estado{font:inherit;font-size:13.5px;font-weight:500;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 13px;cursor:pointer}
.estado.on{background:var(--cs);color:var(--c);border-color:var(--c)}
#sec-dados,#sec-comodos,#sec-textos,.parte{scroll-margin-top:120px}
.rot-campo{font-size:13px;color:var(--muted);margin-bottom:6px}
.fotos{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
figure{border-radius:12px;background:var(--card)}
.foto-data{top:auto;bottom:calc(100% - 134px)}
.foto-local{top:auto;bottom:calc(100% - 110px)}
.foto-n{position:absolute;left:6px;top:6px;background:var(--pri);color:#fff;font-size:11px;font-weight:600;border-radius:6px;padding:2px 6px}
.add-foto{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:178px;border:1.5px dashed color-mix(in srgb,var(--pri) 45%,var(--line));border-radius:12px;color:var(--pri);font-weight:600;font-size:13.5px;cursor:pointer;background:var(--pri-soft);text-align:center;padding:8px}
.add-foto .ic{width:28px;height:28px}
.add-foto.sec{background:var(--card);color:var(--muted);border-color:var(--line)}
@media (max-width:600px){

  /* ações do laudo viram uma barra fixa no rodapé, com o PDF em destaque no centro */
  body.com-barra main{padding-bottom:96px}
  .acoes{position:fixed;left:0;right:0;bottom:0;z-index:20;margin:0;display:grid;grid-template-columns:repeat(5,1fr);gap:0;background:color-mix(in srgb,var(--card) 94%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:6px 4px max(8px,env(safe-area-inset-bottom))}
  .acoes .btn{flex-direction:column;gap:3px;border:0;background:none;box-shadow:none;font-size:11px;padding:4px 2px;color:var(--muted)}
  .acoes .btn .ic{width:22px;height:22px}
  .acoes .btn span.rot{display:none}.acoes .btn span.rot-curto{display:inline}
  .acoes .btn.primary{color:var(--ink)}
  .acoes .btn.primary .ic{width:50px;height:50px;padding:13px;margin-top:-26px;border-radius:50%;background:var(--pri);color:#fff;border:4px solid var(--card);box-shadow:0 4px 12px rgba(29,78,216,.35);box-sizing:border-box}
  .acoes .btn:last-child{grid-column:auto}
}
/* aparência (tema) */
.segmentos{display:inline-flex;background:var(--chip);border-radius:12px;padding:3px;gap:3px;flex-wrap:wrap}
.segmentos button{font:inherit;font-size:14px;border:0;background:none;color:var(--muted);padding:7px 14px;border-radius:9px;cursor:pointer;font-weight:500}
.segmentos button.on{background:var(--card);color:var(--ink);box-shadow:var(--sombra)}

<body>
<header>
  <a id="voltar" class="voltar" href="#/inicio" aria-label="Voltar" hidden>←</a>
  <h1 id="titulo">Laudar</h1>
  <span id="status"></span>
</header>
<main id="app"></main>
<script>
// ---------- Armazenamento local (IndexedDB) ----------
const DB_NAME = 'vistorias-db', STORE = 'vistorias', CONFIG = 'config';
function openDB() {
  return new Promise((res, rej) => {
    const r = indexedDB.open(DB_NAME, 2);
    r.onupgradeneeded = () => {
      const db = r.result;
      if (!db.objectStoreNames.contains(STORE)) db.createObjectStore(STORE, { keyPath: 'id' });
      if (!db.objectStoreNames.contains(CONFIG)) db.createObjectStore(CONFIG, { keyPath: 'id' });
    };
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
}
async function tx(mode, fn, store = STORE) {
  const db = await openDB();
  return new Promise((res, rej) => {
    const t = db.transaction(store, mode);
    const req = fn(t.objectStore(store));
    t.oncomplete = () => res(req && req.result);
    t.onerror = () => rej(t.error);
  });
}
const dbAll = () => tx('readonly', s => s.getAll());
const dbGet = id => tx('readonly', s => s.get(id));
const dbPut = v => tx('readwrite', s => s.put(v));
const dbDel = id => tx('readwrite', s => s.delete(id));
async function cfgGet() {
  // 'imobiliaria' é a chave usada até a v03; lida apenas para não perder o logo já cadastrado
  const c = (await tx('readonly', s => s.get('cabecalho'), CONFIG)) || (await tx('readonly', s => s.get('imobiliaria'), CONFIG));
  return { logo: null, nome: '', contato: '', ...c, id: 'cabecalho' };
}
const cfgPut = c => tx('readwrite', s => s.put(c), CONFIG);
if (navigator.storage && navigator.storage.persist) navigator.storage.persist();

// ---------- Utilidades ----------
const $ = s => document.querySelector(s);
// Ícones desenhados (traço), iguais em todos os aparelhos, no lugar dos emojis nos botões principais
const ICONES = {
  mais: '<path d="M12 5v14M5 12h14"/>',
  livro: '<path d="M4 4.5C4 3.7 4.7 3 5.5 3H20v16H5.5C4.7 19 4 19.7 4 20.5zM4 20.5C4 21.3 4.7 22 5.5 22H20M8 7.5h8"/>',
  laudos: '<path d="M8 3h8l4 4v11H8z"/><path d="M16 3v4h4M5 7v14h11"/>',
  caixa: '<path d="M3 13l3-8h12l3 8v6H3z"/><path d="M3 13h5l1 3h6l1-3h5"/>',
  cracha: '<rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="11" r="2.2"/><path d="M5.5 16c.8-1.5 2-2.2 3.5-2.2s2.7.7 3.5 2.2M14.5 10h4M14.5 13.5h3"/>',
  ajustes: '<path d="M4 6h9M17 6h3M4 12h3M11 12h9M4 18h11M19 18h1"/><circle cx="15" cy="6" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="18" r="2"/>',
  nuvem: '<path d="M7 18a4.5 4.5 0 0 1-.5-9A6 6 0 0 1 18 8.5a4.2 4.2 0 0 1-.5 9.5"/><path d="M12 12v8M9 15l3-3 3 3"/>',
  olho: '<path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>',
  compartilhar: '<circle cx="6" cy="12" r="2.4"/><circle cx="17.5" cy="6" r="2.4"/><circle cx="17.5" cy="18" r="2.4"/><path d="M8.2 10.9l7.1-3.7M8.2 13.1l7.1 3.7"/>',
  pdf: '<path d="M7 3h7l4 4v14H7z"/><path d="M14 3v4h4"/><path d="M12.5 10.5v6m0 0l-2.5-2.5m2.5 2.5l2.5-2.5"/>',
  enviar: '<path d="M21 3L10 14M21 3l-7 18-4-7-7-4z"/>',
  imagem: '<rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-9 9"/>',
  camera: '<path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/>',
  pino: '<path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.6"/>',
  lixo: '<path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/>',
  casa: '<path d="M4 11l8-7 8 7M6 9.5V20h12V9.5"/><path d="M10 20v-5h4v5"/>',
  chave: '<circle cx="8" cy="15" r="4"/><path d="M11 12l9-9M17 6l3 3M15 8l2 2"/>',
  caneta: '<path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13.5 6.5l4 4"/>',
  gota: '<path d="M12 3s6 6.5 6 11a6 6 0 0 1-12 0c0-4.5 6-11 6-11z"/>',
  moeda: '<circle cx="12" cy="12" r="9"/><path d="M15 9.2c-.6-1-1.7-1.5-3-1.5-1.8 0-3 .9-3 2.2 0 3 6 1.6 6 4.4 0 1.3-1.3 2.2-3 2.2-1.4 0-2.6-.6-3.2-1.6M12 6v1.7M12 16.3V18"/>',
  certo: '<path d="M5 12.5l4.5 4.5L19 7.5"/>',
  seta: '<path d="M9 5l7 7-7 7"/>',
  voltar: '<path d="M15 5l-7 7 7 7"/>',
  busca: '<circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/>',
  copiar: '<rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V4H4v12h4"/>',
  pontos: '<circle cx="5" cy="12" r="1.2"/><circle cx="12" cy="12" r="1.2"/><circle cx="19" cy="12" r="1.2"/>',
  galeria: '<rect x="7" y="7" width="14" height="13" rx="2"/><path d="M3 16V5a2 2 0 0 1 2-2h11"/><circle cx="12" cy="12" r="1.6"/><path d="M21 17l-4-4-6 6"/>',
  sol: '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>'
};
const ic = n => `<svg class="ic" viewBox="0 0 24 24" aria-hidden="true">${ICONES[n] || ''}</svg>`;
// cor de cada tipo de laudo (etiquetas, ícones e cartões)
const COR_TIPO = { previa: 'azul', entrega: 'verde', ressalvas: 'roxo', ocorrencia: 'laranja', avaliacao: 'teal' };
const ICONE_TIPO = { previa: 'casa', entrega: 'chave', ressalvas: 'caneta', ocorrencia: 'gota', avaliacao: 'moeda' };
const app = $('#app');
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const hoje = () => { const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 10); };
const fmtData = s => s ? s.split('-').reverse().join('/') : '';
const MESES = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
const extenso = s => { if (!s) return ''; const [a, m, d] = s.split('-'); return `${+d} de ${MESES[m - 1]} de ${a}`; };
const slug = s => (s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-zA-Z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 50);
const TIPOS = { previa: 'Vistoria prévia (entrada)', entrega: 'Vistoria de entrega de chaves', ressalvas: 'Vistoria de ressalvas do locatário', ocorrencia: 'Vistoria de constatação de problema', avaliacao: 'Laudo de avaliação de imóvel' };
const ehAvaliacao = v => v.tipo === 'avaliacao';
const ehRessalvas = v => v.tipo === 'ressalvas';
const ehOcorrencia = v => v.tipo === 'ocorrencia';
// títulos usados no PDF e no cabeçalho das páginas
const TITULO_PDF = { previa: 'LAUDO DE VISTORIA PRÉVIA (ENTRADA)', entrega: 'LAUDO DE VISTORIA DE ENTREGA DE CHAVES',
  ressalvas: 'VISTORIA DE RESSALVAS DO LOCATÁRIO', ocorrencia: 'LAUDO DE CONSTATAÇÃO DE PROBLEMA NO IMÓVEL', avaliacao: 'LAUDO DE AVALIAÇÃO DE IMÓVEL' };
const TITULO_CURTO = { previa: 'Vistoria prévia', entrega: 'Vistoria de entrega de chaves', ressalvas: 'Vistoria de ressalvas do locatário', ocorrencia: 'Constatação de problema', avaliacao: 'Laudo de avaliação' };

// ---------- Vistoria de ressalvas do locatário ----------
// referência ao laudo do locador que está sendo ressalvado (feito ou não neste aplicativo)
const CAMPOS_RS = ['dataOriginal', 'responsavelOriginal', 'dataRecebimento', 'prazoDias'];
const novoRs = () => ({ dataOriginal: '', responsavelOriginal: '', dataRecebimento: '', prazoDias: '10' });
// declaração no singular ou no plural, conforme o número de locatários
function declaracaoRessalvas(v) {
  const data = fmtData(v.rs.dataRecebimento) || '____/____/________';
  return v.partes.locatarios.length > 1
    ? `Os locatários declaram ter recebido o laudo em ${data} e apresentam, no prazo, as divergências abaixo, requerendo que integrem o laudo de vistoria.`
    : `O locatário declara ter recebido o laudo em ${data} e apresenta, no prazo, as divergências abaixo, requerendo que integrem o laudo de vistoria.`;
}
// data-limite = recebimento + prazo (meramente informativa)
function prazoRessalvas(v) {
  const dias = parseInt(v.rs.prazoDias, 10);
  if (!v.rs.dataRecebimento || !(dias >= 0)) return null;
  const [a, m, d] = v.rs.dataRecebimento.split('-').map(Number);
  const limite = new Date(a, m - 1, d + dias);
  const hojeD = new Date(); hojeD.setHours(0, 0, 0, 0);
  return { limite, restam: Math.round((limite - hojeD) / 86400000) };
}
function textoPrazo(v) {
  const p = prazoRessalvas(v);
  if (!p) return 'Informe a data de recebimento do laudo e o prazo do contrato para ver a data-limite.';
  const lim = p.limite.toLocaleDateString('pt-BR');
  if (p.restam > 1) return `📅 Data-limite para apresentar as ressalvas: ${lim} (faltam ${p.restam} dias).`;
  if (p.restam === 1) return `📅 Data-limite: ${lim} (amanhã).`;
  if (p.restam === 0) return `⚠️ Data-limite: ${lim} (hoje).`;
  return `⚠️ O prazo terminou em ${lim}. Verifique o contrato antes de apresentar as ressalvas.`;
}

// ---------- Data, hora e localização das fotos ----------
// Lê os dados gravados pela câmera (EXIF) antes de a foto ser comprimida, pois a compressão os descarta:
// data e hora da captura e, quando o aparelho fornecer, a localização GPS (usada na exportação das fotos).
// Sem data da câmera, usa a data do arquivo (emCamera = false).
async function lerDadosCamera(file) {
  const r = { em: '', emCamera: false, gps: null };
  try {
    const buf = new DataView(await file.slice(0, 256 * 1024).arrayBuffer());
    if (buf.getUint16(0) === 0xFFD8) {
      for (let o = 2; o + 10 < buf.byteLength;) {
        const marca = buf.getUint16(o), tam = buf.getUint16(o + 2);
        if ((marca & 0xFF00) !== 0xFF00) break;
        if (marca === 0xFFE1 && buf.getUint32(o + 4) === 0x45786966) { // "Exif"
          const t = o + 10, le = buf.getUint16(t) === 0x4949;
          const u16 = p => buf.getUint16(t + p, le), u32 = p => buf.getUint32(t + p, le);
          const procurar = (ifd, tag) => { const n = u16(ifd); for (let i = 0; i < n; i++) { const e = ifd + 2 + i * 12; if (u16(e) === tag) return e; } return -1; };
          const ifd0 = u32(4), exif = procurar(ifd0, 0x8769);
          let e = exif >= 0 ? procurar(u32(exif + 8), 0x9003) : -1; // data original da captura
          if (e < 0) e = procurar(ifd0, 0x0132);                    // data de alteração
          if (e >= 0) {
            const ini = t + u32(e + 8);
            let txt = ''; for (let i = 0; i < 19; i++) txt += String.fromCharCode(buf.getUint8(ini + i));
            const m = /^(\d{4}):(\d\d):(\d\d) (\d\d):(\d\d):(\d\d)$/.exec(txt);
            if (m && m[1] !== '0000') { r.em = `${m[1]}-${m[2]}-${m[3]}T${m[4]}:${m[5]}:${m[6]}`; r.emCamera = true; }
          }
          // localização: bloco GPS (latitude e longitude em graus, minutos e segundos)
          const g = procurar(ifd0, 0x8825);
          if (g >= 0) {
            const gi = u32(g + 8);
            const letra = tag => { const x = procurar(gi, tag); return x >= 0 ? String.fromCharCode(buf.getUint8(t + x + 8)) : ''; };
            const graus = tag => {
              const x = procurar(gi, tag); if (x < 0) return null;
              const off = u32(x + 8), parte = i => { const d = u32(off + i * 8 + 4); return d ? u32(off + i * 8) / d : 0; };

  if (o.endereco && !o.rua) v.rua = TXT(o.endereco);
  v.uf = limparUF(v.uf);
  v.partes = sanitizarPartes(o);
  v.av = sanitizarAv(o);
  const rs = o.rs && typeof o.rs === 'object' ? o.rs : {};
  v.rs = novoRs();
  for (const k of ['dataOriginal', 'dataRecebimento']) v.rs[k] = /^\d{4}-\d{2}-\d{2}$/.test(rs[k]) ? rs[k] : '';
  v.rs.responsavelOriginal = TXT(rs.responsavelOriginal, 300);
  v.rs.prazoDias = /^\d{1,3}$/.test(String(rs.prazoDias)) ? String(rs.prazoDias) : '10';
  v.fotoDataHora = o.fotoDataHora === true;
  v.capa = o.capa !== false;
  const oc = o.oc && typeof o.oc === 'object' ? o.oc : {};
  v.oc = novoOc();
  for (const k of CAMPOS_OC) if (k !== 'solicitanteProprio') v.oc[k] = TXT(oc[k], ['descricao', 'origem', 'providencias'].includes(k) ? 20000 : 300);
  v.oc.solicitanteProprio = oc.solicitanteProprio === 'nao' ? 'nao' : 'sim';
  if (!/^\d{4}-\d{2}-\d{2}$/.test(v.oc.dataIdentificacao)) v.oc.dataIdentificacao = '';
  if (!OPCOES_OC.problema.includes(v.oc.problema)) v.oc.problema = '';
  if (!OPCOES_OC.urgencia.includes(v.oc.urgencia)) v.oc.urgencia = '';
  v.cabecalhoRecebido = sanitizarCabecalho(o.cabecalhoRecebido);
  v.usarCabecalhoRecebido = o.usarCabecalhoRecebido === true && !!v.cabecalhoRecebido;
  if (o.origem && typeof o.origem === 'object') v.origem = { autor: TXT(o.origem.autor, 200), arquivo: TXT(o.origem.arquivo, 300), em: Number(o.origem.em) || Date.now() };
  v.data = /^\d{4}-\d{2}-\d{2}$/.test(o.data) ? o.data : '';
  v.acompanhou = o.acompanhou === 'nao' ? 'nao' : 'sim';
  if (typeof o.id === 'string' && /^[a-z0-9]{4,40}$/i.test(o.id)) v.id = o.id;
  v.criadoEm = Number(o.criadoEm) || Date.now();
  v.atualizadoEm = Number(o.atualizadoEm) || Date.now();
  v.comodos = (Array.isArray(o.comodos) ? o.comodos : []).slice(0, 300).filter(c => c && typeof c === 'object').map(c => ({
    id: uid(),
    nome: TXT(c.nome, 200),
    base: typeof c.base === 'string' ? TXT(c.base, 200) : (c.base === null ? null : undefined),
    estado: ESTADOS.includes(c.estado) ? c.estado : '',
    descricao: TXT(c.descricao),
    fotos: (Array.isArray(c.fotos) ? c.fotos : [])
      .filter(f => f && typeof f.data === 'string' && IMG_OK.test(f.data)).slice(0, 500)
      .map(f => ({ id: uid(), legenda: TXT(f.legenda, 500), data: f.data, w: Math.max(1, +f.w || 1), h: Math.max(1, +f.h || 1),
        em: typeof f.em === 'string' && DATA_FOTO_OK.test(f.em) ? f.em : '', emCamera: f.emCamera === true,
        gps: f.gps && coordOk(+f.gps.lat, +f.gps.lon) ? { lat: +f.gps.lat, lon: +f.gps.lon } : null,
        local: sanitizarLocal(f.local) }))
  }));
  v.geo = sanitizarGeo(o.geo);
  return v;
}
const coordOk = (la, lo) => typeof la === 'number' && typeof lo === 'number' && isFinite(la) && isFinite(lo) && Math.abs(la) <= 90 && Math.abs(lo) <= 180;
function sanitizarLocal(l) {
  if (!l || typeof l !== 'object' || !coordOk(+l.lat, +l.lon)) return null;
  return { lat: +l.lat, lon: +l.lon, prec: isFinite(+l.prec) ? Math.max(0, +l.prec) : null, em: TXT(l.em, 40),
    conferida: l.conferida === true, endereco: TXT(l.endereco, 300) };
}
// Registros de local e hora vindos de arquivo: ficam só dados simples (sem código) e de tamanho limitado.
// Os valores não são corrigidos: se algo tiver sido alterado, a conferência do hash do registro acusa.
function limparDados(x, prof = 0) {
  if (x === null || typeof x === 'boolean') return x;
  if (typeof x === 'number') return isFinite(x) ? x : null;
  if (typeof x === 'string') return x.slice(0, 4000);
  if (prof > 6 || typeof x !== 'object') return null;
  if (Array.isArray(x)) return x.slice(0, 50).map(i => limparDados(i, prof + 1));
  const r = {};
  for (const k of Object.keys(x).slice(0, 60)) if (k !== '__proto__' && k !== 'constructor') r[k] = limparDados(x[k], prof + 1);
  return r;
}
function sanitizarGeo(g) {
  const r = { fotos: !!(g && g.fotos === true), registros: [] };
  if (!g || !Array.isArray(g.registros)) return r;
  for (const o of g.registros.slice(0, 20)) {
    if (!o || typeof o !== 'object' || typeof o.id !== 'string' || !o.localizacao || !o.horario) continue;
    const m = o.mapa && typeof o.mapa === 'object' ? o.mapa : null;
    const img = m && typeof m.dataUrl === 'string' && m.dataUrl.length < 3e6 && IMG_OK.test(m.dataUrl) ? m.dataUrl : null;
    const reg = limparDados({ ...o, mapa: m ? { ...m, dataUrl: null } : null });
    if (reg.mapa) reg.mapa.dataUrl = img;
    if (!reg.localizacao || !coordOk(reg.localizacao.latitude, reg.localizacao.longitude)) continue;
    if (!reg.horario || typeof reg.horario !== 'object') continue;
    r.registros.push(reg);
  }
  return r;
}
// O cabeçalho (logo, nome e contato de quem elabora) viaja junto nos arquivos.
function sanitizarCabecalho(c) {
  if (!c || typeof c !== 'object') return null;
  const r = { nome: TXT(c.nome, 200), contato: TXT(c.contato, 1000), logo: null };
  const l = c.logo;
  if (l && typeof l.data === 'string' && IMG_OK.test(l.data)) r.logo = { data: l.data, w: Math.max(1, +l.w || 1), h: Math.max(1, +l.h || 1) };
  return r.nome || r.contato || r.logo ? r : null;
}
const mesmoCabecalho = (a, b) => !!a && !!b && a.nome === b.nome && a.contato === b.contato &&
  ((a.logo && a.logo.data) || '') === ((b.logo && b.logo.data) || '');
const cabecalhoVazio = c => !c || (!c.nome && !c.contato && !c.logo);

// backup = true: cópia de segurança de todas as vistorias e do cadastro deste aparelho
async function pacote(vistorias, backup = false) {
  const cfg = await cfgGet();
  return { formato: FORMATO, versao: 2, backup, exportadoEm: new Date().toISOString(), autor: cfg.nome || '',
    responsavel: { nome: cfg.nome || '', contato: cfg.contato || '', logo: cfg.logo || null }, vistorias };
}
// estrito: só aceita arquivos gerados pelo aplicativo (usado ao ler a pasta compartilhada)
function lerPacote(texto, estrito = false) {
  const d = JSON.parse(texto);
  const doApp = d && d.formato === FORMATO && Array.isArray(d.vistorias);
  if (estrito && !doApp) return null;
  const lista = doApp ? d.vistorias : [].concat(d); // também aceita os backups das versões anteriores
  const vistorias = lista.filter(v => v && typeof v === 'object' && Array.isArray(v.comodos)).map(sanitizar);
  return {
    autor: doApp ? TXT(d.autor, 200) : '',
    backup: doApp && d.backup === true,
    responsavel: doApp ? sanitizarCabecalho(d.responsavel) : null,
    vistorias
  };
}
const nomeArquivoLaudo = v => nomePDF(v).replace(/\.pdf$/, '.json');

// Laudo recebido de outra pessoa: grava no aparelho e decide qual cabeçalho o PDF vai usar.
// Se já existe um laudo com o mesmo código (ex.: ele voltou de outra pessoa), pergunta.
async function importar(v, origem, responsavel) {
  const existente = await dbGet(v.id);
  if (existente) {
    const substituir = confirm(`Já existe neste aparelho uma cópia do laudo "${enderecoCompleto(v) || 'sem endereço'}".\n\n` +
      'OK = substituir pela versão do arquivo\nCancelar = importar como uma nova cópia');
    if (!substituir) v.id = uid();
  }
  // cabeçalho com que o remetente gerava o PDF (o dele, ou o que ele próprio tinha recebido)
  const doRemetente = v.usarCabecalhoRecebido && v.cabecalhoRecebido ? v.cabecalhoRecebido : responsavel;
  const meu = await cfgGet();
  if (doRemetente && !mesmoCabecalho(doRemetente, meu)) {
    v.cabecalhoRecebido = doRemetente;
    v.usarCabecalhoRecebido = confirm(`Este laudo veio com o cabeçalho de "${doRemetente.nome || 'quem enviou'}" (logo, nome e contato).\n\n` +
      'OK = manter o cabeçalho de quem enviou\nCancelar = usar o meu cabeçalho\n\nA escolha pode ser trocada depois, dentro do laudo.');
  } else {
    v.usarCabecalhoRecebido = false;
  }
  v.origem = origem;
  await dbPut(v);
  return v;
}

// Cópia de segurança: restaura as vistorias (uma única pergunta sobre as que já existem) e o cadastro.
async function restaurarBackup(p) {
  const existentes = [];
  for (const v of p.vistorias) if (await dbGet(v.id)) existentes.push(v.id);
  const substituir = existentes.length > 0 && confirm(`${existentes.length} laudo(s) deste backup já existe(m) neste aparelho.\n\n` +
    'OK = substituir pelas versões do backup\nCancelar = manter as deste aparelho (só os laudos novos serão importados)');
  let n = 0;
  for (const v of p.vistorias) {
    if (existentes.includes(v.id) && !substituir) continue;
    await dbPut(v); n++;
  }
  let cadastro = false;
  if (p.responsavel) {
    const meu = await cfgGet();
    if (cabecalhoVazio(meu) || (!mesmoCabecalho(p.responsavel, meu) &&
        confirm(`O backup contém o cadastro do responsável "${p.responsavel.nome || 'sem nome'}" (logo, nome e contato).\n\nDeseja substituir o cadastro deste aparelho por ele?`))) {
      await cfgPut(Object.assign(meu, p.responsavel));
      cadastro = true;
    }
  }
  return { n, cadastro };
}

// Janela "Enviar para edição": monta o arquivo primeiro e só depois oferece as opções,
// para que o toque em "Compartilhar" seja um gesto novo do usuário (exigência dos celulares).
async function abrirEnvio(v) {
  const ov = document.createElement('div');
  ov.className = 'modal';
  ov.innerHTML = '<div class="modal-caixa"><h2>📨 Enviar para edição</h2><p class="muted">Preparando o arquivo…</p></div>';
  document.body.appendChild(ov);
  const caixa = ov.firstElementChild;
  const fechar = () => { ov.remove(); document.removeEventListener('keydown', tecla); };
  const tecla = e => { if (e.key === 'Escape') fechar(); };
  document.addEventListener('keydown', tecla);
  let blob, nome, compartilhavel = null, h = null;
  try {
    blob = new Blob([JSON.stringify(await pacote([v]))], { type: 'application/json' });
    nome = nomeArquivoLaudo(v);
    // alguns celulares não aceitam compartilhar .json: nesse caso o mesmo conteúdo vai como .txt
    const opcoes = [new File([blob], nome, { type: 'application/json' }), new File([blob], nome.replace(/\.json$/, '.txt'), { type: 'text/plain' })];
    if (navigator.canShare) compartilhavel = opcoes.find(a => { try { return navigator.canShare({ files: [a] }); } catch { return false; } }) || null;
    h = suportaPastas ? await pasta('pastaCompart') : null;
  } catch (err) {
    caixa.innerHTML = `<h2>📨 Enviar para edição</h2><p class="aviso">Não foi possível preparar o arquivo (${esc(err.message)}).</p>
      <div class="modal-botoes"><button class="btn" data-e="fechar">Fechar</button></div>`;
    caixa.addEventListener('click', e => { if (e.target.closest('[data-e="fechar"]')) fechar(); });
    return;
  }
  const mb = (blob.size / 1048576).toLocaleString('pt-BR', { maximumFractionDigits: 1 });
  caixa.innerHTML = `
    <h2>📨 Enviar para edição</h2>
    <p style="margin-top:0">Gera um <strong>arquivo do laudo</strong> (dados e fotos, ${mb} MB) para outra pessoa abrir
      <strong>no aplicativo dela</strong>, em <strong>Laudos de outras pessoas → Importar arquivo</strong>, e continuar editando.
      <span class="muted">Não é o PDF.</span></p>
    <p class="muted">O arquivo leva também o seu cabeçalho (logo, nome e contato); quem receber escolhe se o mantém no PDF.</p>
    <p class="aviso" id="envio-msg" hidden></p>
    <div class="modal-botoes">
      ${compartilhavel ? '<button class="btn primary" data-e="compartilhar">📤 Compartilhar (WhatsApp, e-mail…)</button>' : ''}
      ${h ? `<button class="btn" data-e="pasta">📁 Gravar na pasta "${esc(h.name)}"</button>` : ''}
      <button class="btn${compartilhavel ? '' : ' primary'}" data-e="salvar">💾 Salvar arquivo no aparelho</button>
      <button class="btn" data-e="fechar">Fechar</button>
    </div>`;
  const msg = t => { const m = caixa.querySelector('#envio-msg'); m.hidden = false; m.textContent = t; };
  caixa.addEventListener('click', async e => {
    const b = e.target.closest('[data-e]'); if (!b) return;
    if (b.dataset.e === 'fechar') return fechar();
    if (b.dataset.e === 'salvar') {
      baixar(blob, nome);
      return msg(`Arquivo "${nome}" salvo no aparelho (normalmente na pasta Downloads). Envie-o à outra pessoa pelo WhatsApp, e-mail ou outro meio.`);
    }
    if (b.dataset.e === 'pasta') {
      try {
        if (!(await permitir(h))) return msg('Sem permissão para gravar na pasta compartilhada.');
        await gravarNaPasta(h, nome, blob);
        return msg(`Laudo gravado na pasta "${h.name}". Quem tiver acesso a ela pode importá-lo em "Laudos de outras pessoas".`);
      } catch (err) { return msg(`Não foi possível gravar na pasta (${err.message}). Use "Salvar arquivo no aparelho".`); }
    }
    if (b.dataset.e === 'compartilhar') {
      const t0 = Date.now();
      try {
        await navigator.share({ files: [compartilhavel], title: 'Laudo para edição', text: `Arquivo do aplicativo Laudar - ${enderecoCompleto(v)}` });
        fechar(); flash('Arquivo enviado ✓', 3000);
      } catch (err) {
        // "cancelado" logo após o toque costuma ser falha do aparelho, e não desistência do usuário
        if (err.name === 'AbortError' && Date.now() - t0 > 1500) return;
        msg(`Este aparelho não conseguiu abrir o compartilhamento${err.message ? ` (${err.message})` : ''}. Use "Salvar arquivo no aparelho" e envie o arquivo pelo WhatsApp ou e-mail.`);
      }
    }
  });
}

// ---------- Registro de local e hora (motor GeoRegistro, em lib/georegistro.js) ----------
// Opcional em cada laudo: o registro do local da vistoria (cur.geo.registros, guardados dentro do laudo,
// para irem junto no backup e no "Enviar p/ edição") e, se ligado, o local do aparelho nas fotos
// tiradas pelo botão "Tirar foto" (f.local). A localização é pedida só no momento do toque.
const temGeo = !!window.GeoRegistro;
if (temGeo) GeoRegistro.configurar({
  appId: 'vistoria', // separa estes registros dos outros aplicativos publicados no mesmo endereço
  mapa: { ativo: true },
  pdf: { titulo: 'REGISTRO DE LOCAL E HORA DA VISTORIA', corPrincipal: '#1d4ed8', corDestaque: '#16a34a', rodape: '© 2026 Felippe Alvarez · Laudar' }
});
// local da foto: o gravado pela câmera tem prioridade sobre o do aparelho
const coordenadasFoto = f => f.gps && coordOk(f.gps.lat, f.gps.lon) ? f.gps : f.local && coordOk(f.local.lat, f.local.lon) ? { lat: f.local.lat, lon: f.local.lon } : null;
const fmtCoord = (la, lo) => `${(+la).toFixed(6)}, ${(+lo).toFixed(6)}`;
const linkMapa = (la, lo) => `https://www.google.com/maps?q=${+la},${+lo}`;
function fmtGeoHora(r) {
  try { return new Date(r.horario.dispositivoEpochMs).toLocaleString('pt-BR', { timeZone: r.horario.fusoIANA || undefined }); }
  catch { return String(r.horario.dispositivoISO || ''); }
}
// situação da hora: conferida na internet, divergente do relógio do aparelho ou não conferida
function conferenciaHora(r) {
  const h = r.horario || {};
  if (!h.referenciaConfirmada) return { ok: false, txt: 'não conferida (sem internet no momento do registro)' };
  if (h.alertaRelogio) return { ok: false, txt: `o relógio do aparelho diferia ${Math.round(Math.abs(h.diferencaSeg))} s da hora da internet` };
  return { ok: true, txt: 'conferida pela internet' };
}
const geoPendente = r => !!((r.endereco && r.endereco.pendente && !r.endereco.texto) || (r.mapa && r.mapa.pendente && !r.mapa.dataUrl));

function blocoGeo(v) {
  if (!temGeo) return '';
  const regs = v.geo.registros;
  return `
    <h3>📍 Local e hora da vistoria <span class="muted" style="font-weight:400">(opcional)</span></h3>
    <p class="muted" style="margin-top:0">Registra a localização do aparelho e a hora <strong>somente no momento do toque</strong>, como indício de que a vistoria foi feita no imóvel. Não há rastreamento contínuo.</p>
    ${regs.map((r, i) => cartaoGeo(r, i)).join('')}
    <div class="row">
      <button class="btn${regs.length ? '' : ' primary'}" data-act="geoRegistrar">📍 ${regs.length ? 'Registrar novamente (ex.: saída)' : 'Registrar local e hora'}</button>
      ${regs.some(geoPendente) ? '<button class="btn" data-act="geoCompletar">↻ Completar endereço e mapa</button>' : ''}
    </div>
    <label class="check" style="margin-top:12px"><input type="checkbox" data-geofotos ${v.geo.fotos ? 'checked' : ''}>
      <span>Registrar também o local do aparelho nas fotos tiradas com “📷 Tirar foto” neste laudo</span></label>`;
}
function cartaoGeo(r, i) {
  const l = r.localizacao, e = r.endereco || {}, h = conferenciaHora(r);
  return `<div class="geo-reg">
    ${r.mapa && r.mapa.dataUrl ? `<img class="geo-mapa" src="${r.mapa.dataUrl}" alt="Mapa do local registrado">` : '<div class="geo-mapa geo-sem-mapa">Mapa pendente</div>'}
    <div class="geo-info">
      <strong>${esc(r.observacao || 'Registro ' + (i + 1))}</strong>
      <dl>
        <dt>Data e hora</dt><dd>${esc(fmtGeoHora(r))}</dd>
        <dt>Hora</dt><dd class="${h.ok ? 'ok' : 'alerta'}">${h.ok ? '✓ ' : '⚠️ '}${esc(h.txt)}</dd>
        <dt>Margem de erro</dt><dd class="${l.precisaoBaixa ? 'alerta' : 'ok'}">± ${esc(Math.round(l.precisaoM))} m${l.precisaoBaixa ? ' (precisão baixa)' : ''}</dd>
        <dt>Endereço pelo GPS</dt><dd>${e.texto ? esc(e.texto) + (e.aproximado ? ' (aproximado)' : '') : 'pendente: precisa de internet'}</dd>
        <dt>Coordenadas</dt><dd>${esc(fmtCoord(l.latitude, l.longitude))}</dd>

        <button class="btn danger" data-act="geoExcluir" data-i="${i}">Remover</button>
      </div>
    </div>
  </div>`;
}
// confere o hash de cada registro mostrado na tela
function verificarGeo() {
  if (!temGeo || !cur) return;
  cur.geo.registros.forEach((r, i) => GeoRegistro.verificarIntegridade(r).then(res => {
    const el = app.querySelector(`[data-geoint="${i}"]`); if (!el) return;
    el.className = res.ok ? 'ok' : 'alerta';
    el.textContent = res.ok ? '✓ registro não alterado desde que foi salvo' : res.motivo === 'SEM_HASH' ? '⚠️ registro sem código de integridade' : '⚠️ o registro foi alterado depois de salvo';
  }, () => {}));
}

// Janela de captura: localiza, mostra o resultado e só grava quando a pessoa confirma.
function abrirRegistroGeo() {
  const v = cur;
  const ov = document.createElement('div'); ov.className = 'modal';
  const caixa = document.createElement('div'); caixa.className = 'modal-caixa'; ov.appendChild(caixa);
  document.body.appendChild(ov);
  let aberto = true, rascunho = null;
  const fechar = () => { aberto = false; ov.remove(); };
  const capturar = () => {
    rascunho = null;
    caixa.innerHTML = `<h2>📍 Registrar local e hora</h2>
      <p class="muted" style="margin-top:0">${esc(GeoRegistro.textos.aviso)}</p>
      <p class="aviso" id="geo-status">Pedindo a localização ao aparelho… Se o navegador perguntar, toque em <strong>Permitir</strong>.</p>
      <div class="modal-botoes"><button class="btn" data-g="fechar">Cancelar</button></div>`;
    const st = caixa.querySelector('#geo-status');
    GeoRegistro.capturar({

      onStatus: s => {
        if (!aberto) return;
        if (s.etapa === 'localizando') st.textContent = `Localizando… margem de erro atual: ± ${s.precisaoM} m (aguardando ficar abaixo de 25 m)`;
        if (s.etapa === 'obtendo_endereco_e_hora') st.textContent = `Ponto obtido (± ${s.precisaoM} m). Buscando o endereço, conferindo a hora e montando o mapa…`;
      }
    }).then(r => { if (aberto) { rascunho = r; mostrar(); } }, err => {
      if (!aberto) return;
      caixa.innerHTML = `<h2>📍 Não foi possível registrar</h2><p class="aviso">${esc(err.message)}</p>
        <div class="modal-botoes"><button class="btn primary" data-g="denovo">Tentar de novo</button><button class="btn" data-g="fechar">Fechar</button></div>`;
    });
  };
  const mostrar = () => {
    const r = rascunho, l = r.localizacao, e = r.endereco || {}, h = conferenciaHora(r);
    caixa.innerHTML = `<h2>📍 Confira o registro</h2>

// registros feitos sem internet: completa endereço e mapa (só os feitos neste aparelho, guardados pelo motor)
async function completarGeo() {

}

// Local do aparelho nas fotos: a localização começa a ser obtida quando a câmera é aberta,
// enquanto a pessoa enquadra a foto, e é anexada às fotos quando fica pronta.
let geoFoto = null;
const geoPendentes = new Set();
function iniciarGeoFoto() {
  geoFoto = { inicio: Date.now(), p: GeoRegistro.capturar({ tipo: 'foto', mapa: false, tempoMaxMs: 15000 }).then(r => r, erro => ({ erro })) };
}
async function anexarGeoFoto(g, vid, ids) {
  ids.forEach(id => geoPendentes.add(id));
  const r = await g.p;
  ids.forEach(id => geoPendentes.delete(id));
  const marcar = (id, txt) => { const el = app.querySelector(`[data-local="${id}"]`); if (el) { el.textContent = txt; el.hidden = !txt; } };
  if (r.erro) {
    ids.forEach(id => marcar(id, ''));
    if (r.erro.codigo === 'PERMISSAO_NEGADA') alert('Sem permissão para usar a localização: ' + r.erro.message);
    else flash('Foto salva sem localização (' + r.erro.message + ')', 6000);
    return;
  }
  const local = { lat: r.localizacao.latitude, lon: r.localizacao.longitude, prec: r.localizacao.precisaoM,
    em: r.horario.dispositivoISO, conferida: !!r.horario.referenciaConfirmada, endereco: (r.endereco && r.endereco.texto) || '' };
  const alvo = cur && cur.id === vid ? cur : migrar(await dbGet(vid));
  if (!alvo) return;
  for (const c of alvo.comodos) for (const f of c.fotos) if (ids.includes(f.id)) { f.local = local; marcar(f.id, rotuloLocal(f)); }
  if (alvo === cur) salvar(); else await dbPut(alvo);
}
const rotuloLocal = f => f.gps ? '📍 câmera' : f.local ? `📍 aparelho ±${Math.round(f.local.prec || 0)} m` : geoPendentes.has(f.id) ? '📍 obtendo local…' : '';

// ---------- Exportação das fotos do laudo ----------
// Exporta a versão otimizada (a mesma usada no laudo). Quando a câmera forneceu, a data da captura e a
// localização GPS são gravadas de volta no arquivo JPEG, para conferência de quando e onde a foto foi tirada.
function blocoExif(f) {
  const data = f.emCamera && DATA_FOTO_OK.test(f.em || '') ? f.em.slice(0, 19).replace(/-/g, ':').replace('T', ' ') : '';
  const gps = coordenadasFoto(f);
  if (!data && !gps) return null;
  const n0 = (data ? 1 : 0) + (gps ? 1 : 0), tamIfd = n => 2 + n * 12 + 4;
  let p = 8 + tamIfd(n0);
  const ifdExif = p; if (data) p += tamIfd(1);
  const ifdGps = p; if (gps) p += tamIfd(5);
  const pData = p; if (data) p += 20;
  const pLat = p, pLon = p + 24; if (gps) p += 48;
  const b = new DataView(new ArrayBuffer(p));
  b.setUint16(0, 0x4949); b.setUint16(2, 42, true); b.setUint32(4, 8, true); // cabeçalho TIFF "II"
  let o = 8;
  const entrada = (tag, tipo, qtd, valor) => { b.setUint16(o, tag, true); b.setUint16(o + 2, tipo, true); b.setUint32(o + 4, qtd, true); b.setUint32(o + 8, valor, true); o += 12; };
  b.setUint16(o, n0, true); o += 2;
  if (data) entrada(0x8769, 4, 1, ifdExif);
  if (gps) entrada(0x8825, 4, 1, ifdGps);
  b.setUint32(o, 0, true);
  if (data) {
    o = ifdExif; b.setUint16(o, 1, true); o += 2;
    entrada(0x9003, 2, 20, pData); b.setUint32(o, 0, true);
    for (let i = 0; i < 19; i++) b.setUint8(pData + i, data.charCodeAt(i));
  }
  if (gps) {
    o = ifdGps; b.setUint16(o, 5, true); o += 2;
    entrada(0x0000, 1, 4, 0x00000302);                                // versão 2.3.0.0
    entrada(0x0001, 2, 2, (gps.lat < 0 ? 'S' : 'N').charCodeAt(0));
    entrada(0x0002, 5, 3, pLat);
    entrada(0x0003, 2, 2, (gps.lon < 0 ? 'W' : 'E').charCodeAt(0));
    entrada(0x0004, 5, 3, pLon);
    b.setUint32(o, 0, true);
    const gms = (pos, v) => {
      v = Math.abs(v);
      const g = Math.floor(v), mf = (v - g) * 60, m = Math.floor(mf), s = Math.round((mf - m) * 600000);
      [[g, 1], [m, 1], [s, 10000]].forEach(([n, d], i) => { b.setUint32(pos + i * 8, n, true); b.setUint32(pos + i * 8 + 4, d, true); });
    };
    gms(pLat, gps.lat); gms(pLon, gps.lon);
  }
  const tiff = new Uint8Array(b.buffer), app1 = new Uint8Array(10 + tiff.length);
  const a = new DataView(app1.buffer);
  a.setUint16(0, 0xFFE1); a.setUint16(2, 8 + tiff.length);
  app1.set([0x45, 0x78, 0x69, 0x66, 0, 0], 4); app1.set(tiff, 10);
  return app1;
}
// insere o bloco EXIF logo após o início do JPEG (e após o bloco JFIF, se houver)
function inserirExif(jpg, app1) {
  let pos = 2;
  if (jpg[2] === 0xFF && jpg[3] === 0xE0) pos = 4 + ((jpg[4] << 8) | jpg[5]);
  const r = new Uint8Array(jpg.length + app1.length);
  r.set(jpg.subarray(0, pos)); r.set(app1, pos); r.set(jpg.subarray(pos), pos + app1.length);
  return r;
}
const bytesDeDataUrl = url => { const bin = atob(url.slice(url.indexOf(',') + 1)); const u = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); return u; };
const imagemDe = src => new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = src; });
const canvasParaBytes = cv => new Promise(res => cv.toBlob(async b => res(new Uint8Array(await b.arrayBuffer())), 'image/jpeg', 0.92));

// Desenha a foto e, se pedido, uma faixa com o cômodo e o endereço na parte de baixo.
async function jpegDaFoto(f, carimbo) {
  if (!carimbo && /^data:image\/jpeg/.test(f.data)) return bytesDeDataUrl(f.data);
  const img = await imagemDe(f.data);
  const cv = document.createElement('canvas'); cv.width = img.naturalWidth; cv.height = img.naturalHeight;
  const g = cv.getContext('2d');
  g.drawImage(img, 0, 0);
  if (carimbo) {
    const w = cv.width, h = cv.height, faixa = Math.round(Math.max(56, h * 0.12)), m = Math.round(faixa * 0.3);
    const f1 = Math.round(faixa * 0.34), f2 = Math.round(faixa * 0.25);
    const caber = (txt, larg) => { if (g.measureText(txt).width <= larg) return txt; while (txt.length > 3 && g.measureText(txt + '…').width > larg) txt = txt.slice(0, -1); return txt + '…'; };
    g.fillStyle = 'rgba(0,0,0,0.62)'; g.fillRect(0, h - faixa, w, faixa);
    g.fillStyle = '#ffffff'; g.textBaseline = 'alphabetic';
    g.font = `600 ${f1}px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif`;
    g.fillText(caber(carimbo.comodo, w - 2 * m), m, h - faixa + Math.round(faixa * 0.42));
    g.font = `${f2}px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif`;
    g.fillText(caber(carimbo.endereco, w - 2 * m), m, h - faixa + Math.round(faixa * 0.78));
  }
  return canvasParaBytes(cv);
}
const nn = i => String(i + 1).padStart(2, '0');
const nomeFoto = (c, ci, f, fi) => `${nn(ci)}-${slug(c.nome) || 'Comodo'}-foto-${nn(fi)}` +
  (f.legenda ? '-' + slug(f.legenda).toLowerCase().slice(0, 40).replace(/-+$/, '') : '') + '.jpg';
async function arquivosDasFotos(v, escolhidas, carimbar) {
  const endereco = [enderecoCompleto(v), cidadeUF(v)].filter(Boolean).join(' - ');
  const lista = [];
  for (const [ci, fi] of escolhidas) {
    const c = v.comodos[ci], f = c.fotos[fi];
    let bytes = await jpegDaFoto(f, carimbar ? { comodo: c.nome || 'Cômodo', endereco: endereco || 'Endereço não informado' } : null);
    const app1 = blocoExif(f);
    if (app1) bytes = inserirExif(bytes, app1);
    lista.push({ nome: nomeFoto(c, ci, f, fi), bytes });
  }
  return lista;
}

// .zip sem compressão (as fotos JPEG já são comprimidas); nomes em UTF-8
const TAB_CRC = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
const crc32 = u => { let c = 0xFFFFFFFF; for (let i = 0; i < u.length; i++) c = TAB_CRC[(c ^ u[i]) & 0xFF] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; };
function montarZip(arquivos) {
  const enc = new TextEncoder(), partes = [], central = [];
  const d = new Date(), hora = (d.getHours() << 11) | (d.getMinutes() << 5) | (d.getSeconds() >> 1);
  const dia = ((d.getFullYear() - 1980) << 9) | ((d.getMonth() + 1) << 5) | d.getDate();
  let pos = 0;
  for (const a of arquivos) {
    const nome = enc.encode(a.nome), crc = crc32(a.bytes), n = a.bytes.length;
    const lh = new DataView(new ArrayBuffer(30));
    [[0, 0x04034b50, 4], [4, 20, 2], [6, 0x0800, 2], [8, 0, 2], [10, hora, 2], [12, dia, 2], [14, crc, 4], [18, n, 4], [22, n, 4], [26, nome.length, 2], [28, 0, 2]]
      .forEach(([o, v, t]) => t === 4 ? lh.setUint32(o, v, true) : lh.setUint16(o, v, true));
    partes.push(new Uint8Array(lh.buffer), nome, a.bytes);
    const ch = new DataView(new ArrayBuffer(46));
    [[0, 0x02014b50, 4], [4, 20, 2], [6, 20, 2], [8, 0x0800, 2], [10, 0, 2], [12, hora, 2], [14, dia, 2], [16, crc, 4], [20, n, 4], [24, n, 4],
      [28, nome.length, 2], [30, 0, 2], [32, 0, 2], [34, 0, 2], [36, 0, 2], [38, 0, 4], [42, pos, 4]]
      .forEach(([o, v, t]) => t === 4 ? ch.setUint32(o, v, true) : ch.setUint16(o, v, true));
    central.push(new Uint8Array(ch.buffer), nome);
    pos += 30 + nome.length + n;
  }
  const tamCentral = central.reduce((s, p) => s + p.length, 0);
  const fim = new DataView(new ArrayBuffer(22));
  fim.setUint32(0, 0x06054b50, true); fim.setUint16(8, arquivos.length, true); fim.setUint16(10, arquivos.length, true);
  fim.setUint32(12, tamCentral, true); fim.setUint32(16, pos, true);
  return new Blob([...partes, ...central, new Uint8Array(fim.buffer)], { type: 'application/zip' });
}

// Janela "Fotos": 1) escolher fotos e opções; 2) preparar; 3) compartilhar, baixar .zip ou salvar na pasta.
// O preparo vem antes do toque em "Compartilhar", que precisa ser um gesto novo do usuário nos celulares.
async function abrirFotos(v) {
  const todas = [];
  v.comodos.forEach((c, ci) => c.fotos.forEach((f, fi) => todas.push([ci, fi])));
  if (!todas.length) { alert('Este laudo ainda não tem fotos.'); return; }
  const pastaPdf = suportaPastas ? await pasta('pastaPDF') : null;
  const ov = document.createElement('div');
  ov.className = 'modal';
  document.body.appendChild(ov);
  const caixa = document.createElement('div'); caixa.className = 'modal-caixa'; ov.appendChild(caixa);
  const fechar = () => { ov.remove(); document.removeEventListener('keydown', tecla); };
  const tecla = e => { if (e.key === 'Escape') fechar(); };
  document.addEventListener('keydown', tecla);
  let escopo = 'todas', marcadas = new Set(todas.map(x => x.join('.'))), carimbar = false, prontos = null;
  const escolhidas = () => escopo === 'todas' ? todas : escopo === 'escolher'
    ? todas.filter(x => marcadas.has(x.join('.'))) : todas.filter(x => x[0] === +escopo);
  const msg = t => { const m = caixa.querySelector('#fotos-msg'); m.hidden = !t; m.textContent = t || ''; };

  const etapaEscolha = () => {
    prontos = null;
    const n = escolhidas().length;
    caixa.innerHTML = `
      <h2>🖼️ Fotos do laudo</h2>
      <p class="muted" style="margin-top:0">Versão otimizada (até 1600 px), em JPEG. A data da câmera e a localização (da câmera ou, se registrada, do aparelho) vão gravadas no arquivo quando estiverem disponíveis.</p>
      <label>Quais fotos<select id="fotos-escopo">
        <option value="todas" ${escopo === 'todas' ? 'selected' : ''}>Todas as fotos (${todas.length})</option>
        ${v.comodos.map((c, ci) => c.fotos.length ? `<option value="${ci}" ${escopo === String(ci) ? 'selected' : ''}>${esc(c.nome || 'Cômodo')} (${c.fotos.length})</option>` : '').join('')}
        <option value="escolher" ${escopo === 'escolher' ? 'selected' : ''}>Escolher as fotos…</option>
      </select></label>
      ${escopo === 'escolher' ? `<div class="sel-fotos">${todas.map(([ci, fi]) => {
        const k = ci + '.' + fi;
        return `<label class="sel-foto"><img src="${v.comodos[ci].fotos[fi].data}" alt=""><input type="checkbox" data-k="${k}" ${marcadas.has(k) ? 'checked' : ''}><span>${esc(v.comodos[ci].nome)} ${fi + 1}</span></label>`;
      }).join('')}</div>` : ''}
      <label class="check" style="margin-top:12px"><input type="checkbox" id="fotos-carimbo" ${carimbar ? 'checked' : ''}>
        <span>Carimbar na foto o cômodo e o endereço do imóvel</span></label>
      <p class="aviso" id="fotos-msg" hidden></p>
      <div class="modal-botoes">
        <button class="btn primary" data-e="preparar" ${n ? '' : 'disabled'}>Preparar ${n} foto${n === 1 ? '' : 's'}</button>
        <button class="btn" data-e="fechar">Fechar</button>
      </div>`;
  };
  const etapaAcoes = () => {
    const total = prontos.reduce((s, a) => s + a.bytes.length, 0);
    const tam = total < 1048576 ? Math.max(1, Math.round(total / 1024)) + ' KB' : (total / 1048576).toLocaleString('pt-BR', { maximumFractionDigits: 1 }) + ' MB';
    const arquivos = prontos.map(a => new File([a.bytes], a.nome, { type: 'image/jpeg' }));
    let podeCompartilhar = false;
    try { podeCompartilhar = !!(navigator.canShare && navigator.canShare({ files: arquivos })); } catch { /* não suportado */ }
    caixa.innerHTML = `
      <h2>🖼️ ${prontos.length} foto${prontos.length === 1 ? '' : 's'} pronta${prontos.length === 1 ? '' : 's'}</h2>
      <p class="muted" style="margin-top:0">Total de ${tam}.${podeCompartilhar ? ' Pelo WhatsApp, envie como <strong>documento</strong> para não perder qualidade.' : ''}</p>
      <p class="aviso" id="fotos-msg" hidden></p>
      <div class="modal-botoes">
        ${podeCompartilhar ? '<button class="btn primary" data-e="compartilhar">📤 Compartilhar as fotos</button>' : ''}
        <button class="btn${podeCompartilhar ? '' : ' primary'}" data-e="zip">💾 Baixar em um arquivo .zip</button>
        ${pastaPdf ? `<button class="btn" data-e="pasta">📁 Salvar na pasta "${esc(pastaPdf.name)}"</button>` : ''}
        <button class="btn" data-e="voltar">← Voltar</button>
        <button class="btn" data-e="fechar">Fechar</button>
      </div>`;
    if (!podeCompartilhar && navigator.canShare) msg('Este aparelho não consegue compartilhar essa quantidade de fotos de uma vez. Use o arquivo .zip ou escolha menos fotos.');
    caixa._arquivos = arquivos;
  };
  const nomeBase = nomePDF(v).replace(/\.pdf$/, '') + '-fotos';

  caixa.addEventListener('change', e => {
    const t = e.target;
    if (t.id === 'fotos-escopo') { escopo = t.value; etapaEscolha(); }
    else if (t.id === 'fotos-carimbo') carimbar = t.checked;
    else if (t.dataset.k) {
      t.checked ? marcadas.add(t.dataset.k) : marcadas.delete(t.dataset.k);
      const n = escolhidas().length, bt = caixa.querySelector('[data-e="preparar"]');
      bt.disabled = !n; bt.textContent = `Preparar ${n} foto${n === 1 ? '' : 's'}`;
    }
  });
  caixa.addEventListener('click', async e => {
    const b = e.target.closest('[data-e]'); if (!b) return;
    const acao = b.dataset.e;
    if (acao === 'fechar') return fechar();
    if (acao === 'voltar') return etapaEscolha();
    if (acao === 'preparar') {
      b.disabled = true; b.textContent = 'Preparando…';
      try { prontos = await arquivosDasFotos(v, escolhidas(), carimbar); etapaAcoes(); }
      catch (err) { b.disabled = false; b.textContent = 'Tentar de novo'; msg('Não foi possível preparar as fotos (' + err.message + ').'); }
      return;
    }
    if (acao === 'zip') {
      baixar(montarZip(prontos), nomeBase + '.zip');
      return msg(`Arquivo "${nomeBase}.zip" salvo no aparelho (normalmente na pasta Downloads).`);
    }
    if (acao === 'pasta') {
      try {
        if (!(await permitir(pastaPdf))) return msg('Sem permissão para gravar na pasta escolhida.');
        const sub = await pastaPdf.getDirectoryHandle(nomeBase, { create: true });
        for (const a of prontos) await gravarNaPasta(sub, a.nome, new Blob([a.bytes], { type: 'image/jpeg' }));
        return msg(`${prontos.length} foto(s) salvas na pasta "${pastaPdf.name}/${nomeBase}".`);
      } catch (err) { return msg('Não foi possível gravar na pasta (' + err.message + '). Use o arquivo .zip.'); }
    }
    if (acao === 'compartilhar') {
      const t0 = Date.now();
      try {
        await navigator.share({ files: caixa._arquivos, title: 'Fotos do laudo', text: `Fotos do laudo - ${enderecoCompleto(v)}` });
        fechar(); flash('Fotos enviadas ✓', 3000);
      } catch (err) {
        if (err.name === 'AbortError' && Date.now() - t0 > 1500) return; // a pessoa cancelou
        msg(`Este aparelho não conseguiu abrir o compartilhamento${err.message ? ` (${err.message})` : ''}. Use o arquivo .zip.`);
      }
    }
  });
  etapaEscolha();
}

// ---------- Ditado por voz ----------
// Usa o reconhecimento de voz do navegador: Google (Chrome, Edge, Android) ou Apple (Safari, iPhone).
// O áudio é processado pelo serviço do navegador e só funciona com internet; o aplicativo não grava áudio.
const Reconhecimento = window.SpeechRecognition || window.webkitSpeechRecognition;
const temDitado = !!Reconhecimento;
const ehCelular = /android|iphone|ipad|ipod/i.test(navigator.userAgent);
let ditado = null; // sessão ativa: { rec, botao, rotulo, campo, base, ativo, erro, editado }

function botaoDitar(alvo, estilo) {
  if (!temDitado) return '';
  const mini = estilo === 'mini';
  const btn = `<button type="button" class="btn mic${mini ? ' mini' : ''}" data-act="ditar" data-alvo="${esc(alvo)}" title="Ditar por voz (precisa de internet)">${mini ? '🎤' : '🎤 Ditar'}</button>`;

// acrescenta o trecho ditado ao texto, com espaço e inicial maiúscula no começo de frase
function juntar(base, trecho) {
  trecho = trecho.trim();
  if (!trecho) return base;
  if (!base.trim() || /[.!?]\s*$/.test(base)) trecho = trecho.charAt(0).toLocaleUpperCase('pt-BR') + trecho.slice(1);
  return base + (!base || /\s$/.test(base) ? '' : ' ') + trecho;
}
function avisoDitado(d, msg) {
  const s = d.botao.isConnected && d.botao.parentElement.querySelector('.voz-status');
  if (s) s.textContent = msg; else if (msg) flash(msg, 2500);
}
function gravarNoCampo(d, texto) {
  if (!d.campo.isConnected) return;
  d.campo.value = texto;
  d.campo.dispatchEvent(new Event('input', { bubbles: true })); // salva pelo mesmo caminho da digitação
  if (d.campo.tagName === 'TEXTAREA') d.campo.scrollTop = d.campo.scrollHeight;
}
function encerrarDitado(d) {
  if (!d.editado) gravarNoCampo(d, d.base); // descarta o trecho provisório que não foi confirmado
  d.botao.classList.remove('gravando');
  d.botao.textContent = d.rotulo;
  avisoDitado(d, '');
  if (ditado === d) ditado = null;
}
function iniciarDitado(botao) {
  const campo = app.querySelector(botao.dataset.alvo);
  if (!campo) return;
  if (!navigator.onLine) {
    alert('O ditado por voz só funciona com conexão à internet.\nSem conexão, digite o texto normalmente.');
    return;
  }
  const rec = new Reconhecimento();
  rec.lang = 'pt-BR';
  rec.interimResults = true;
  rec.continuous = !ehCelular; // no celular o modo contínuo repete trechos; lá o reconhecimento é reiniciado a cada pausa
  const d = { rec, botao, rotulo: botao.textContent, campo, base: campo.value, ativo: true, erro: false, editado: false };
  ditado = d;
  rec.onresult = e => {
    if (d.editado) return; // a pessoa digitou no campo: o que ela escreveu prevalece
    let provisorio = '';
    for (let i = e.resultIndex; i < e.results.length; i++) {
      const t = e.results[i][0].transcript;
      if (e.results[i].isFinal) d.base = juntar(d.base, t); else provisorio += t;
    }
    gravarNoCampo(d, juntar(d.base, provisorio));
  };
  rec.onerror = e => {
    if (e.error === 'no-speech' || e.error === 'aborted') return;
    d.erro = true;
    const msgs = {
      'not-allowed': 'O microfone foi bloqueado. Permita o uso do microfone para este aplicativo nas configurações do navegador ou do celular.',
      'service-not-allowed': 'O ditado por voz não está liberado neste navegador ou aparelho.',
      'network': 'O ditado por voz precisa de internet. Verifique a conexão e tente de novo.',
      'audio-capture': 'Nenhum microfone foi encontrado neste aparelho.',
      'language-not-supported': 'O ditado em português não está disponível neste aparelho.'
    };
    alert(msgs[e.error] || 'Não foi possível usar o ditado por voz (' + e.error + ').');
  };
  rec.onend = () => {
    if (d.ativo && !d.erro && ditado === d && d.campo.isConnected) {
      try { rec.start(); return; } catch { /* segue para encerrar */ }
    }
    encerrarDitado(d);
  };
  try { rec.start(); } catch (err) { ditado = null; alert('Não foi possível iniciar o ditado: ' + err.message); return; }
  botao.classList.add('gravando');
  botao.textContent = botao.classList.contains('mini') ? '⏹' : '⏹ Parar';
  avisoDitado(d, 'Ouvindo… fale agora. Toque em Parar ao terminar.');
}
function pararDitado() {
  const d = ditado;
  if (!d) return;
  d.ativo = false;
  try { d.rec.stop(); } catch { encerrarDitado(d); } // o onend confirma o último trecho e encerra
}
// usado antes de redesenhar a tela ou trocar de tela
function cancelarDitado() {
  const d = ditado;
  if (!d) return;
  ditado = null; d.ativo = false;
  if (!d.editado) gravarNoCampo(d, d.base);
  try { d.rec.abort(); } catch { /* já encerrado */ }
}

  $('#titulo').textContent = titulo;

  !Object.values(v.partes || {}).flat().some(p => CAMPOS_PARTE.some(k => String(p[k] || '').trim())) &&
  !CAMPOS_AV.some(k => k !== 'finalidade' && String((v.av || {})[k] || '').trim()) &&
  !['dataOriginal', 'responsavelOriginal', 'dataRecebimento'].some(k => String((v.rs || {})[k] || '').trim()) &&
  !CAMPOS_OC.some(k => k !== 'solicitanteProprio' && String((v.oc || {})[k] || '').trim());
async function rotear() {
  cancelarDitado();
  const anterior = cur;
  await flush();
  const [, nome, id] = location.hash.match(/^#\/([a-z]+)(?:\/([a-z0-9]+))?/i) || [];
  if (anterior && !(nome === 'vistoria' && id === anterior.id) && vazia(anterior)) await dbDel(anterior.id);
  // sem o aceite da versão atual dos Termos, nenhuma outra tela é aberta
  if (!(await termosAceitos())) { cur = null; scrollTo(0, 0); return telaTermos(true); }
  if (nome === 'vistoria' && id) {
    if (!cur || cur.id !== id) {
      const v = await dbGet(id);
      if (!v) { ir('vistorias'); return; }
      cur = migrar(v); tab = 0; scrollTo(0, 0);
    }
    return telaEditor();
  }
  cur = null;
  scrollTo(0, 0);
  if (nome === 'tutorial') return telaTutorial(id); // #/tutorial/<seção>
  const telas = { novo: telaNovo, vistorias: telaVistorias, recebidos: telaRecebidos, cadastro: telaCadastro, config: telaConfig, termos: telaTermos };
  (telas[nome] || telaInicio)();
}
window.addEventListener('hashchange', rotear);

function etapasLaudo(v) {

    <h3>7. Registro de local e hora (geolocalização)</h3>
    <p>O aplicativo oferece, <strong>de forma opcional e desligada por padrão</strong>, o registro da localização do aparelho e da hora em cada laudo, por meio do motor GeoRegistro. Sobre essa funcionalidade:</p>

      <li>a localização é dado pessoal do usuário e pode indicar a presença de outras pessoas no local; cabe ao usuário decidir sobre o uso da funcionalidade, informar as pessoas envolvidas quando for o caso e compartilhar os registros somente com quem deva recebê-los.</li>

    <h3>8. Isenção de responsabilidade</h3>

function filtrarLaudos() {
  const q = chave(($('[data-busca]') || {}).value || ''), f = ($('.filtros .chip.on') || { dataset: {} }).dataset.tipo || '';
  let n = 0;
  app.querySelectorAll('.laudo[data-texto]').forEach(el => { el.hidden = (q && !el.dataset.texto.includes(q)) || (f && el.dataset.tipo !== f); if (!el.hidden) n++; });
