<style>

body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line);padding:10px 16px;padding-top:max(10px,env(safe-area-inset-top));display:flex;gap:10px;align-items:center;min-height:52px}

.voltar{font-size:22px;line-height:1;text-decoration:none;color:var(--ink);padding:4px 10px 6px;border-radius:8px;border:1px solid var(--line)}

header.sem-topo{display:none}
a.btn{text-decoration:none}
/* tela inicial */
.saudacao{margin:4px 0 16px;color:var(--muted)}
.menu{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;margin-bottom:16px}

.tile .ico{font-size:26px;line-height:1.2}
.tile strong{font-size:15px}
.tile small{color:var(--muted);font-size:13px}
.tile.primary{background:var(--pri);border-color:var(--pri);color:#fff}
.tile.primary small{color:rgba(255,255,255,.85)}
/* tutorial: primeiro botão do menu, ocupando a linha inteira */
.tile.tutorial{grid-column:1/-1;min-height:0;display:grid;grid-template-columns:auto 1fr;column-gap:12px;align-items:center;background:var(--chip);border-color:var(--pri)}
.tile.tutorial .ico{grid-row:span 2;font-size:30px}
.tile.largo{grid-column:1/-1;min-height:0;display:grid;grid-template-columns:auto 1fr;column-gap:12px;align-items:center}
.tile.largo .ico{grid-row:span 2;font-size:30px}
/* nome do aplicativo no alto da tela inicial */
.marca{max-width:640px;display:flex;align-items:center;justify-content:center;gap:16px;margin:10px 0 20px}
.marca-simbolo{width:84px;height:84px;flex:none}
.marca-nome{font-size:46px;font-weight:600;letter-spacing:3px;line-height:1;color:var(--pri)}

/* tela inicial: todos os botões no formato do "Novo laudo" (largura total, ícone à esquerda, mesma altura) */
.menu{grid-template-columns:1fr;max-width:640px}
.menu .tile{grid-column:1/-1;min-height:96px;display:grid;grid-template-columns:44px 1fr;column-gap:12px;align-items:center;padding:14px 16px}

/* escolha do tipo de laudo */

/* lembrete de backup */

/* janela (enviar para edição) */

<body>
<header>
  <a id="voltar" class="voltar" href="#/inicio" aria-label="Voltar" hidden>←</a>
  <h1 id="titulo">Laudar</h1>
  <span id="status"></span>
</header>
<main id="app"></main>
<script>
// ---------- Armazenamento local (IndexedDB) ----------
const DB_NAME = 'vistorias-db', STORE = 'vistorias', CONFIG = 'config';
function openDB() {
  return new Promise((res, rej) => {
    const r = indexedDB.open(DB_NAME, 2);
    r.onupgradeneeded = () => {
      const db = r.result;
      if (!db.objectStoreNames.contains(STORE)) db.createObjectStore(STORE, { keyPath: 'id' });
      if (!db.objectStoreNames.contains(CONFIG)) db.createObjectStore(CONFIG, { keyPath: 'id' });
    };
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
}
async function tx(mode, fn, store = STORE) {
  const db = await openDB();
  return new Promise((res, rej) => {
    const t = db.transaction(store, mode);
    const req = fn(t.objectStore(store));
    t.oncomplete = () => res(req && req.result);
    t.onerror = () => rej(t.error);
  });
}
const dbAll = () => tx('readonly', s => s.getAll());
const dbGet = id => tx('readonly', s => s.get(id));
const dbPut = v => tx('readwrite', s => s.put(v));
const dbDel = id => tx('readwrite', s => s.delete(id));
async function cfgGet() {
  // 'imobiliaria' é a chave usada até a v03; lida apenas para não perder o logo já cadastrado
  const c = (await tx('readonly', s => s.get('cabecalho'), CONFIG)) || (await tx('readonly', s => s.get('imobiliaria'), CONFIG));
  return { logo: null, nome: '', contato: '', ...c, id: 'cabecalho' };
}
const cfgPut = c => tx('readwrite', s => s.put(c), CONFIG);
if (navigator.storage && navigator.storage.persist) navigator.storage.persist();

// ---------- Utilidades ----------
const $ = s => document.querySelector(s);
const app = $('#app');
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const hoje = () => { const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 10); };
const fmtData = s => s ? s.split('-').reverse().join('/') : '';
const MESES = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
const extenso = s => { if (!s) return ''; const [a, m, d] = s.split('-'); return `${+d} de ${MESES[m - 1]} de ${a}`; };
const slug = s => (s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-zA-Z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 50);
const TIPOS = { previa: 'Vistoria prévia (entrada)', entrega: 'Vistoria de entrega de chaves', ressalvas: 'Vistoria de ressalvas do locatário', ocorrencia: 'Vistoria de constatação de problema', avaliacao: 'Laudo de avaliação de imóvel' };
const ehAvaliacao = v => v.tipo === 'avaliacao';
const ehRessalvas = v => v.tipo === 'ressalvas';
const ehOcorrencia = v => v.tipo === 'ocorrencia';
// títulos usados no PDF e no cabeçalho das páginas
const TITULO_PDF = { previa: 'LAUDO DE VISTORIA PRÉVIA (ENTRADA)', entrega: 'LAUDO DE VISTORIA DE ENTREGA DE CHAVES',
  ressalvas: 'VISTORIA DE RESSALVAS DO LOCATÁRIO', ocorrencia: 'LAUDO DE CONSTATAÇÃO DE PROBLEMA NO IMÓVEL', avaliacao: 'LAUDO DE AVALIAÇÃO DE IMÓVEL' };
const TITULO_CURTO = { previa: 'Vistoria prévia', entrega: 'Vistoria de entrega de chaves', ressalvas: 'Vistoria de ressalvas do locatário', ocorrencia: 'Constatação de problema', avaliacao: 'Laudo de avaliação' };

// ---------- Vistoria de ressalvas do locatário ----------
// referência ao laudo do locador que está sendo ressalvado (feito ou não neste aplicativo)
const CAMPOS_RS = ['dataOriginal', 'responsavelOriginal', 'dataRecebimento', 'prazoDias'];
const novoRs = () => ({ dataOriginal: '', responsavelOriginal: '', dataRecebimento: '', prazoDias: '10' });
// declaração no singular ou no plural, conforme o número de locatários
function declaracaoRessalvas(v) {
  const data = fmtData(v.rs.dataRecebimento) || '____/____/________';
  return v.partes.locatarios.length > 1
    ? `Os locatários declaram ter recebido o laudo em ${data} e apresentam, no prazo, as divergências abaixo, requerendo que integrem o laudo de vistoria.`
    : `O locatário declara ter recebido o laudo em ${data} e apresenta, no prazo, as divergências abaixo, requerendo que integrem o laudo de vistoria.`;
}
// data-limite = recebimento + prazo (meramente informativa)
function prazoRessalvas(v) {
  const dias = parseInt(v.rs.prazoDias, 10);
  if (!v.rs.dataRecebimento || !(dias >= 0)) return null;
  const [a, m, d] = v.rs.dataRecebimento.split('-').map(Number);
  const limite = new Date(a, m - 1, d + dias);
  const hojeD = new Date(); hojeD.setHours(0, 0, 0, 0);
  return { limite, restam: Math.round((limite - hojeD) / 86400000) };
}
function textoPrazo(v) {
  const p = prazoRessalvas(v);
  if (!p) return 'Informe a data de recebimento do laudo e o prazo do contrato para ver a data-limite.';
  const lim = p.limite.toLocaleDateString('pt-BR');
  if (p.restam > 1) return `📅 Data-limite para apresentar as ressalvas: ${lim} (faltam ${p.restam} dias).`;
  if (p.restam === 1) return `📅 Data-limite: ${lim} (amanhã).`;
  if (p.restam === 0) return `⚠️ Data-limite: ${lim} (hoje).`;
  return `⚠️ O prazo terminou em ${lim}. Verifique o contrato antes de apresentar as ressalvas.`;
}

// ---------- Data e hora das fotos ----------
// Lê a data de captura gravada pela câmera (EXIF) antes de a foto ser comprimida;
// sem EXIF, usa a data do arquivo.
async function dataDaFoto(file) {
  try {
    const buf = new DataView(await file.slice(0, 256 * 1024).arrayBuffer());
    if (buf.getUint16(0) === 0xFFD8) {
      for (let o = 2; o + 10 < buf.byteLength;) {
        const marca = buf.getUint16(o), tam = buf.getUint16(o + 2);
        if ((marca & 0xFF00) !== 0xFF00) break;
        if (marca === 0xFFE1 && buf.getUint32(o + 4) === 0x45786966) { // "Exif"
          const t = o + 10, le = buf.getUint16(t) === 0x4949;
          const u16 = p => buf.getUint16(t + p, le), u32 = p => buf.getUint32(t + p, le);
          const procurar = (ifd, tag) => { const n = u16(ifd); for (let i = 0; i < n; i++) { const e = ifd + 2 + i * 12; if (u16(e) === tag) return e; } return -1; };
          const ifd0 = u32(4), exif = procurar(ifd0, 0x8769);
          let e = exif >= 0 ? procurar(u32(exif + 8), 0x9003) : -1; // data original da captura
          if (e < 0) e = procurar(ifd0, 0x0132);                    // data de alteração
          if (e >= 0) {
            const ini = t + u32(e + 8);
            let txt = ''; for (let i = 0; i < 19; i++) txt += String.fromCharCode(buf.getUint8(ini + i));
            const m = /^(\d{4}):(\d\d):(\d\d) (\d\d):(\d\d):(\d\d)$/.exec(txt);
            if (m && m[1] !== '0000') return `${m[1]}-${m[2]}-${m[3]}T${m[4]}:${m[5]}:${m[6]}`;
          }
          break;
        }
        o += 2 + tam;
      }
    }
  } catch { /* sem EXIF legível */ }
  return file.lastModified ? new Date(file.lastModified).toISOString() : '';
}
const DATA_FOTO_OK = /^\d{4}-\d\d-\d\dT\d\d:\d\d(:\d\d(\.\d+)?)?Z?$/;
const fmtDataHora = s => s ? new Date(s).toLocaleString('pt-BR', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' }) : '';
const ESTADOS = ['', 'Novo', 'Bom', 'Regular', 'Ruim'];

function numeroBR(s) {

// valor por extenso em reais (até bilhões), no padrão usado em laudos: "quatrocentos e cinquenta mil reais"
function reaisPorExtenso(valor) {
  const U = ['', 'um', 'dois', 'três', 'quatro', 'cinco', 'seis', 'sete', 'oito', 'nove', 'dez', 'onze', 'doze', 'treze', 'quatorze',
    'quinze', 'dezesseis', 'dezessete', 'dezoito', 'dezenove'];
  const D = ['', '', 'vinte', 'trinta', 'quarenta', 'cinquenta', 'sessenta', 'setenta', 'oitenta', 'noventa'];
  const C = ['', 'cento', 'duzentos', 'trezentos', 'quatrocentos', 'quinhentos', 'seiscentos', 'setecentos', 'oitocentos', 'novecentos'];
  const ate999 = n => {
    if (n === 100) return 'cem';
    const c = Math.floor(n / 100), r = n % 100, p = [];
    if (c) p.push(C[c]);
    if (r) p.push(r < 20 ? U[r] : D[Math.floor(r / 10)] + (r % 10 ? ' e ' + U[r % 10] : ''));
    return p.join(' e ');
  };
  const inteiro = n => {
    if (n === 0) return 'zero';
    const grupos = []; for (let x = n; x > 0; x = Math.floor(x / 1000)) grupos.push(x % 1000);
    const nomes = [null, ['mil', 'mil'], ['milhão', 'milhões'], ['bilhão', 'bilhões']];
    const partes = [];
    for (let g = grupos.length - 1; g >= 0; g--) {
      const v = grupos[g]; if (!v) continue;
      const t = g === 0 ? ate999(v) : g === 1 ? (v === 1 ? 'mil' : ate999(v) + ' mil') : ate999(v) + ' ' + nomes[g][v === 1 ? 0 : 1];
      partes.push({ t, v, g });
    }
    // "e" antes do último grupo quando ele é menor que 100 ou centena exata (mil e duzentos; mil e cinquenta)
    return partes.map((p, i) => i === 0 ? p.t : (i === partes.length - 1 && (p.v < 100 || p.v % 100 === 0) ? ' e ' : ' ') + p.t).join('');
  };

  if (reais) partes.push(inteiro(reais) + (reais % 1000000 === 0 && reais >= 1000000 ? ' de' : '') + (reais === 1 ? ' real' : ' reais'));
  if (cent) partes.push(inteiro(cent) + (cent === 1 ? ' centavo' : ' centavos'));
  return partes.join(' e ') || 'zero real';
}

function loadImage(file) {
  return new Promise((res, rej) => {
    const img = new Image();
    img.onload = () => res(img);
    img.onerror = rej;
    img.src = URL.createObjectURL(file);
  });
}
async function comprimir(file, max = 1600, q = 0.82, tipo = 'image/jpeg') {
  const img = await loadImage(file);
  const k = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
  const w = Math.round(img.naturalWidth * k), h = Math.round(img.naturalHeight * k);
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  c.getContext('2d').drawImage(img, 0, 0, w, h);
  URL.revokeObjectURL(img.src);
  return { data: c.toDataURL(tipo, q), w, h };
}

      .map(f => ({ id: uid(), legenda: TXT(f.legenda, 500), data: f.data, w: Math.max(1, +f.w || 1), h: Math.max(1, +f.h || 1),
        em: typeof f.em === 'string' && DATA_FOTO_OK.test(f.em) ? f.em : '' }))
  }));
  return v;
}
// O cabeçalho (logo, nome e contato de quem elabora) viaja junto nos arquivos.
function sanitizarCabecalho(c) {
  if (!c || typeof c !== 'object') return null;
  const r = { nome: TXT(c.nome, 200), contato: TXT(c.contato, 1000), logo: null };
  const l = c.logo;
  if (l && typeof l.data === 'string' && IMG_OK.test(l.data)) r.logo = { data: l.data, w: Math.max(1, +l.w || 1), h: Math.max(1, +l.h || 1) };
  return r.nome || r.contato || r.logo ? r : null;
}
const mesmoCabecalho = (a, b) => !!a && !!b && a.nome === b.nome && a.contato === b.contato &&
  ((a.logo && a.logo.data) || '') === ((b.logo && b.logo.data) || '');
const cabecalhoVazio = c => !c || (!c.nome && !c.contato && !c.logo);

// backup = true: cópia de segurança de todas as vistorias e do cadastro deste aparelho
async function pacote(vistorias, backup = false) {
  const cfg = await cfgGet();
  return { formato: FORMATO, versao: 2, backup, exportadoEm: new Date().toISOString(), autor: cfg.nome || '',
    responsavel: { nome: cfg.nome || '', contato: cfg.contato || '', logo: cfg.logo || null }, vistorias };
}
// estrito: só aceita arquivos gerados pelo aplicativo (usado ao ler a pasta compartilhada)
function lerPacote(texto, estrito = false) {
  const d = JSON.parse(texto);
  const doApp = d && d.formato === FORMATO && Array.isArray(d.vistorias);
  if (estrito && !doApp) return null;
  const lista = doApp ? d.vistorias : [].concat(d); // também aceita os backups das versões anteriores
  const vistorias = lista.filter(v => v && typeof v === 'object' && Array.isArray(v.comodos)).map(sanitizar);
  return {
    autor: doApp ? TXT(d.autor, 200) : '',
    backup: doApp && d.backup === true,
    responsavel: doApp ? sanitizarCabecalho(d.responsavel) : null,
    vistorias
  };
}
const nomeArquivoLaudo = v => nomePDF(v).replace(/\.pdf$/, '.json');

// Laudo recebido de outra pessoa: grava no aparelho e decide qual cabeçalho o PDF vai usar.
// Se já existe um laudo com o mesmo código (ex.: ele voltou de outra pessoa), pergunta.
async function importar(v, origem, responsavel) {
  const existente = await dbGet(v.id);
  if (existente) {
    const substituir = confirm(`Já existe neste aparelho uma cópia do laudo "${enderecoCompleto(v) || 'sem endereço'}".\n\n` +
      'OK = substituir pela versão do arquivo\nCancelar = importar como uma nova cópia');
    if (!substituir) v.id = uid();
  }
  // cabeçalho com que o remetente gerava o PDF (o dele, ou o que ele próprio tinha recebido)
  const doRemetente = v.usarCabecalhoRecebido && v.cabecalhoRecebido ? v.cabecalhoRecebido : responsavel;
  const meu = await cfgGet();
  if (doRemetente && !mesmoCabecalho(doRemetente, meu)) {
    v.cabecalhoRecebido = doRemetente;
    v.usarCabecalhoRecebido = confirm(`Este laudo veio com o cabeçalho de "${doRemetente.nome || 'quem enviou'}" (logo, nome e contato).\n\n` +
      'OK = manter o cabeçalho de quem enviou\nCancelar = usar o meu cabeçalho\n\nA escolha pode ser trocada depois, dentro do laudo.');
  } else {
    v.usarCabecalhoRecebido = false;
  }
  v.origem = origem;
  await dbPut(v);
  return v;
}

// Cópia de segurança: restaura as vistorias (uma única pergunta sobre as que já existem) e o cadastro.
async function restaurarBackup(p) {
  const existentes = [];
  for (const v of p.vistorias) if (await dbGet(v.id)) existentes.push(v.id);
  const substituir = existentes.length > 0 && confirm(`${existentes.length} laudo(s) deste backup já existe(m) neste aparelho.\n\n` +
    'OK = substituir pelas versões do backup\nCancelar = manter as deste aparelho (só os laudos novos serão importados)');
  let n = 0;
  for (const v of p.vistorias) {
    if (existentes.includes(v.id) && !substituir) continue;
    await dbPut(v); n++;
  }
  let cadastro = false;
  if (p.responsavel) {
    const meu = await cfgGet();
    if (cabecalhoVazio(meu) || (!mesmoCabecalho(p.responsavel, meu) &&
        confirm(`O backup contém o cadastro do responsável "${p.responsavel.nome || 'sem nome'}" (logo, nome e contato).\n\nDeseja substituir o cadastro deste aparelho por ele?`))) {
      await cfgPut(Object.assign(meu, p.responsavel));
      cadastro = true;
    }
  }
  return { n, cadastro };
}

// Janela "Enviar para edição": monta o arquivo primeiro e só depois oferece as opções,
// para que o toque em "Compartilhar" seja um gesto novo do usuário (exigência dos celulares).
async function abrirEnvio(v) {
  const ov = document.createElement('div');
  ov.className = 'modal';
  ov.innerHTML = '<div class="modal-caixa"><h2>📨 Enviar para edição</h2><p class="muted">Preparando o arquivo…</p></div>';
  document.body.appendChild(ov);
  const caixa = ov.firstElementChild;
  const fechar = () => { ov.remove(); document.removeEventListener('keydown', tecla); };
  const tecla = e => { if (e.key === 'Escape') fechar(); };
  document.addEventListener('keydown', tecla);
  let blob, nome, compartilhavel = null, h = null;
  try {
    blob = new Blob([JSON.stringify(await pacote([v]))], { type: 'application/json' });
    nome = nomeArquivoLaudo(v);
    // alguns celulares não aceitam compartilhar .json: nesse caso o mesmo conteúdo vai como .txt
    const opcoes = [new File([blob], nome, { type: 'application/json' }), new File([blob], nome.replace(/\.json$/, '.txt'), { type: 'text/plain' })];
    if (navigator.canShare) compartilhavel = opcoes.find(a => { try { return navigator.canShare({ files: [a] }); } catch { return false; } }) || null;
    h = suportaPastas ? await pasta('pastaCompart') : null;
  } catch (err) {
    caixa.innerHTML = `<h2>📨 Enviar para edição</h2><p class="aviso">Não foi possível preparar o arquivo (${esc(err.message)}).</p>
      <div class="modal-botoes"><button class="btn" data-e="fechar">Fechar</button></div>`;
    caixa.addEventListener('click', e => { if (e.target.closest('[data-e="fechar"]')) fechar(); });
    return;
  }
  const mb = (blob.size / 1048576).toLocaleString('pt-BR', { maximumFractionDigits: 1 });
  caixa.innerHTML = `
    <h2>📨 Enviar para edição</h2>
    <p style="margin-top:0">Gera um <strong>arquivo do laudo</strong> (dados e fotos, ${mb} MB) para outra pessoa abrir
      <strong>no aplicativo dela</strong>, em <strong>Laudos de outras pessoas → Importar arquivo</strong>, e continuar editando.
      <span class="muted">Não é o PDF.</span></p>
    <p class="muted">O arquivo leva também o seu cabeçalho (logo, nome e contato); quem receber escolhe se o mantém no PDF.</p>
    <p class="aviso" id="envio-msg" hidden></p>
    <div class="modal-botoes">
      ${compartilhavel ? '<button class="btn primary" data-e="compartilhar">📤 Compartilhar (WhatsApp, e-mail…)</button>' : ''}
      ${h ? `<button class="btn" data-e="pasta">📁 Gravar na pasta "${esc(h.name)}"</button>` : ''}
      <button class="btn${compartilhavel ? '' : ' primary'}" data-e="salvar">💾 Salvar arquivo no aparelho</button>
      <button class="btn" data-e="fechar">Fechar</button>
    </div>`;
  const msg = t => { const m = caixa.querySelector('#envio-msg'); m.hidden = false; m.textContent = t; };
  caixa.addEventListener('click', async e => {
    const b = e.target.closest('[data-e]'); if (!b) return;
    if (b.dataset.e === 'fechar') return fechar();
    if (b.dataset.e === 'salvar') {
      baixar(blob, nome);
      return msg(`Arquivo "${nome}" salvo no aparelho (normalmente na pasta Downloads). Envie-o à outra pessoa pelo WhatsApp, e-mail ou outro meio.`);
    }
    if (b.dataset.e === 'pasta') {
      try {
        if (!(await permitir(h))) return msg('Sem permissão para gravar na pasta compartilhada.');
        await gravarNaPasta(h, nome, blob);
        return msg(`Laudo gravado na pasta "${h.name}". Quem tiver acesso a ela pode importá-lo em "Laudos de outras pessoas".`);
      } catch (err) { return msg(`Não foi possível gravar na pasta (${err.message}). Use "Salvar arquivo no aparelho".`); }
    }
    if (b.dataset.e === 'compartilhar') {
      const t0 = Date.now();
      try {
        await navigator.share({ files: [compartilhavel], title: 'Laudo para edição', text: `Arquivo do aplicativo Laudar - ${enderecoCompleto(v)}` });
        fechar(); flash('Arquivo enviado ✓', 3000);
      } catch (err) {
        // "cancelado" logo após o toque costuma ser falha do aparelho, e não desistência do usuário
        if (err.name === 'AbortError' && Date.now() - t0 > 1500) return;
        msg(`Este aparelho não conseguiu abrir o compartilhamento${err.message ? ` (${err.message})` : ''}. Use "Salvar arquivo no aparelho" e envie o arquivo pelo WhatsApp ou e-mail.`);
      }
    }
  });
}

// ---------- Ditado por voz ----------
// Usa o reconhecimento de voz do navegador: Google (Chrome, Edge, Android) ou Apple (Safari, iPhone).
// O áudio é processado pelo serviço do navegador e só funciona com internet; o aplicativo não grava áudio.
const Reconhecimento = window.SpeechRecognition || window.webkitSpeechRecognition;
const temDitado = !!Reconhecimento;
const ehCelular = /android|iphone|ipad|ipod/i.test(navigator.userAgent);
let ditado = null; // sessão ativa: { rec, botao, rotulo, campo, base, ativo, erro, editado }

function botaoDitar(alvo, estilo) {
  if (!temDitado) return '';
  const mini = estilo === 'mini';
  const btn = `<button type="button" class="btn mic${mini ? ' mini' : ''}" data-act="ditar" data-alvo="${esc(alvo)}" title="Ditar por voz (precisa de internet)">${mini ? '🎤' : '🎤 Ditar'}</button>`;
  return mini ? btn : `<div class="voz ${estilo}">${btn}<span class="voz-status"></span></div>`;
}
// acrescenta o trecho ditado ao texto, com espaço e inicial maiúscula no começo de frase
function juntar(base, trecho) {
  trecho = trecho.trim();
  if (!trecho) return base;
  if (!base.trim() || /[.!?]\s*$/.test(base)) trecho = trecho.charAt(0).toLocaleUpperCase('pt-BR') + trecho.slice(1);
  return base + (!base || /\s$/.test(base) ? '' : ' ') + trecho;
}
function avisoDitado(d, msg) {
  const s = d.botao.isConnected && d.botao.parentElement.querySelector('.voz-status');
  if (s) s.textContent = msg; else if (msg) flash(msg, 2500);
}
function gravarNoCampo(d, texto) {
  if (!d.campo.isConnected) return;
  d.campo.value = texto;
  d.campo.dispatchEvent(new Event('input', { bubbles: true })); // salva pelo mesmo caminho da digitação
  if (d.campo.tagName === 'TEXTAREA') d.campo.scrollTop = d.campo.scrollHeight;
}
function encerrarDitado(d) {
  if (!d.editado) gravarNoCampo(d, d.base); // descarta o trecho provisório que não foi confirmado
  d.botao.classList.remove('gravando');
  d.botao.textContent = d.rotulo;
  avisoDitado(d, '');
  if (ditado === d) ditado = null;
}
function iniciarDitado(botao) {
  const campo = app.querySelector(botao.dataset.alvo);
  if (!campo) return;
  if (!navigator.onLine) {
    alert('O ditado por voz só funciona com conexão à internet.\nSem conexão, digite o texto normalmente.');
    return;
  }
  const rec = new Reconhecimento();
  rec.lang = 'pt-BR';
  rec.interimResults = true;
  rec.continuous = !ehCelular; // no celular o modo contínuo repete trechos; lá o reconhecimento é reiniciado a cada pausa
  const d = { rec, botao, rotulo: botao.textContent, campo, base: campo.value, ativo: true, erro: false, editado: false };
  ditado = d;
  rec.onresult = e => {
    if (d.editado) return; // a pessoa digitou no campo: o que ela escreveu prevalece
    let provisorio = '';
    for (let i = e.resultIndex; i < e.results.length; i++) {
      const t = e.results[i][0].transcript;
      if (e.results[i].isFinal) d.base = juntar(d.base, t); else provisorio += t;
    }
    gravarNoCampo(d, juntar(d.base, provisorio));
  };
  rec.onerror = e => {
    if (e.error === 'no-speech' || e.error === 'aborted') return;
    d.erro = true;
    const msgs = {
      'not-allowed': 'O microfone foi bloqueado. Permita o uso do microfone para este aplicativo nas configurações do navegador ou do celular.',
      'service-not-allowed': 'O ditado por voz não está liberado neste navegador ou aparelho.',
      'network': 'O ditado por voz precisa de internet. Verifique a conexão e tente de novo.',
      'audio-capture': 'Nenhum microfone foi encontrado neste aparelho.',
      'language-not-supported': 'O ditado em português não está disponível neste aparelho.'
    };
    alert(msgs[e.error] || 'Não foi possível usar o ditado por voz (' + e.error + ').');
  };
  rec.onend = () => {
    if (d.ativo && !d.erro && ditado === d && d.campo.isConnected) {
      try { rec.start(); return; } catch { /* segue para encerrar */ }
    }
    encerrarDitado(d);
  };
  try { rec.start(); } catch (err) { ditado = null; alert('Não foi possível iniciar o ditado: ' + err.message); return; }
  botao.classList.add('gravando');
  botao.textContent = botao.classList.contains('mini') ? '⏹' : '⏹ Parar';
  avisoDitado(d, 'Ouvindo… fale agora. Toque em Parar ao terminar.');
}
function pararDitado() {
  const d = ditado;
  if (!d) return;
  d.ativo = false;
  try { d.rec.stop(); } catch { encerrarDitado(d); } // o onend confirma o último trecho e encerra
}
// usado antes de redesenhar a tela ou trocar de tela
function cancelarDitado() {
  const d = ditado;
  if (!d) return;
  ditado = null; d.ativo = false;
  if (!d.editado) gravarNoCampo(d, d.base);
  try { d.rec.abort(); } catch { /* já encerrado */ }
}

// ---------- Navegação entre telas ----------
// Endereços: #/inicio, #/vistorias, #/recebidos, #/cadastro, #/config, #/vistoria/<código>
// (assim o botão "voltar" do celular e do navegador funciona normalmente)
const ir = rota => { location.hash = '#/' + rota; };
function topo(titulo, voltarPara) {
  $('#titulo').textContent = titulo;
  const a = $('#voltar');
  a.hidden = !voltarPara;
  if (voltarPara) a.href = '#/' + voltarPara;
  // tela inicial: sem título nem botão voltar, a barra do topo some (o nome aparece em destaque na página)
  document.querySelector('header').classList.toggle('sem-topo', !titulo && !voltarPara);
}
// vistoria aberta e deixada sem nenhum dado (ex.: toque acidental em "Nova vistoria")
const vazia = v => !v.comodos.length && !CAMPOS_TEXTO.some(k => String(v[k] || '').trim()) &&
  !Object.values(v.partes || {}).flat().some(p => CAMPOS_PARTE.some(k => String(p[k] || '').trim())) &&
  !CAMPOS_AV.some(k => k !== 'finalidade' && String((v.av || {})[k] || '').trim()) &&
  !['dataOriginal', 'responsavelOriginal', 'dataRecebimento'].some(k => String((v.rs || {})[k] || '').trim()) &&
  !CAMPOS_OC.some(k => k !== 'solicitanteProprio' && String((v.oc || {})[k] || '').trim());
async function rotear() {
  cancelarDitado();
  const anterior = cur;
  await flush();
  const [, nome, id] = location.hash.match(/^#\/([a-z]+)(?:\/([a-z0-9]+))?/i) || [];
  if (anterior && !(nome === 'vistoria' && id === anterior.id) && vazia(anterior)) await dbDel(anterior.id);
  // sem o aceite da versão atual dos Termos, nenhuma outra tela é aberta
  if (!(await termosAceitos())) { cur = null; scrollTo(0, 0); return telaTermos(true); }
  if (nome === 'vistoria' && id) {
    if (!cur || cur.id !== id) {
      const v = await dbGet(id);
      if (!v) { ir('vistorias'); return; }
      cur = migrar(v); tab = 0; scrollTo(0, 0);
    }
    return telaEditor();
  }
  cur = null;
  scrollTo(0, 0);
  if (nome === 'tutorial') return telaTutorial(id); // #/tutorial/<seção>
  const telas = { novo: telaNovo, vistorias: telaVistorias, recebidos: telaRecebidos, cadastro: telaCadastro, config: telaConfig, termos: telaTermos };
  (telas[nome] || telaInicio)();
}
window.addEventListener('hashchange', rotear);

const termosAceitos = async () => { const a = await cfgLer('aceite'); return !!a && a.versao === TERMOS_VERSAO; };
async function telaTermos(exigirAceite = false) {

    <h3>1. Objeto</h3>
    <p>O aplicativo é uma ferramenta de apoio à elaboração de laudos de vistoria de imóveis para locação (inclusive de ressalvas do locatário), de laudos de constatação de problemas em imóveis e de laudos de avaliação de imóveis, disponibilizada <strong>“no estado em que se encontra”</strong>, sem garantias de qualquer natureza, expressas ou implícitas, inclusive de adequação a uma finalidade específica, de funcionamento ininterrupto ou de ausência de erros.</p>

    <h3>2. Armazenamento dos dados</h3>
    <p>As vistorias, fotografias, dados pessoais e demais informações inseridas no aplicativo são armazenados <strong>exclusivamente no dispositivo do usuário</strong> (e, quando o próprio usuário assim escolher, em pastas ou serviços de terceiros por ele indicados). O desenvolvedor <strong>não recebe, não armazena, não acessa e não tem meios de recuperar</strong> essas informações.</p>

    <h3>3. Proteção de dados pessoais (LGPD)</h3>
    <p>O aplicativo permite o registro de dados pessoais de terceiros, como nomes, números de CPF/CNPJ, endereços e imagens de imóveis. Em relação a esses dados, o <strong>usuário é o único controlador</strong>, nos termos da Lei nº 13.709/2018 (Lei Geral de Proteção de Dados Pessoais – LGPD), cabendo-lhe exclusivamente:</p>

      <li>manter a segurança do dispositivo em que o aplicativo é utilizado (senha, bloqueio de tela, atualizações) e dos arquivos gerados;</li>
      <li>responder pelo envio e compartilhamento de laudos, PDFs e arquivos para edição a terceiros, por qualquer meio (WhatsApp, e-mail, pastas compartilhadas, serviços de nuvem etc.);</li>
      <li>decidir sobre o uso do ditado por voz (seção 6), ciente de que a fala é processada por serviço de terceiro, e evitar ditar dados pessoais desnecessários;</li>
      <li>eliminar os dados quando cessada a finalidade do tratamento, observados os prazos legais de guarda.</li>

    <p>Como não tem acesso aos dados inseridos, o desenvolvedor <strong>não atua como controlador nem como operador</strong> desses dados e não responde por seu tratamento, vazamento, perda ou uso indevido.</p>

    <h3>4. Conteúdo dos laudos</h3>
    <p>O usuário é integralmente responsável pela veracidade, exatidão e completude das informações, descrições e fotografias inseridas, bem como pela revisão do laudo antes de sua assinatura e utilização. Os textos padrão oferecidos pelo aplicativo (inclusive declarações e prazos) são <strong>meros modelos</strong>, não constituem aconselhamento jurídico e devem ser ajustados pelo usuário à legislação aplicável, ao contrato de locação e às circunstâncias de cada caso.</p>
    <p>Na <strong>vistoria de ressalvas do locatário</strong>, a observância dos prazos contratuais e legais, a forma e a comprovação da entrega do documento ao locador e o seu conteúdo são de exclusiva responsabilidade do usuário. A data-limite exibida pelo aplicativo é calculada apenas a partir das informações digitadas pelo usuário, tem caráter <strong>meramente informativo</strong> e não substitui a leitura do contrato.</p>
    <p>Quando o usuário opta por imprimir a <strong>data e a hora das fotos</strong>, elas são obtidas dos dados gravados pela câmera ou, na falta destes, da data do arquivo no aparelho, e podem não corresponder ao momento real da captura (por exemplo, se o relógio do aparelho estiver incorreto ou a foto tiver sido editada ou copiada).</p>
    <p>Na <strong>vistoria de constatação de problema</strong>, as constatações, a origem provável indicada, a urgência e as providências recomendadas são de exclusiva responsabilidade de quem elabora o laudo, resultam de inspeção visual e <strong>não substituem perícia técnica</strong> por profissional habilitado, quando necessária. A escolha dos destinatários e a forma de comunicação a terceiros também cabem exclusivamente ao usuário.</p>
    <p>Nos <strong>laudos de avaliação</strong>, os valores indicados, a metodologia, as premissas e as conclusões são <strong>estimativas de exclusiva responsabilidade do avaliador</strong>. O aplicativo limita-se a registrar as informações inseridas e a efetuar operações aritméticas simples (como o valor por metro quadrado e o valor por extenso); não realiza pesquisa ou estimativa de valor de mercado, não verifica a habilitação profissional do avaliador nem a observância de normas técnicas (como a ABNT NBR 14653) ou de exigências legais e processuais, e não substitui o trabalho técnico de profissional habilitado.</p>

    <h3>5. Falhas, perda de dados e disponibilidade</h3>
    <p>O aplicativo pode apresentar erros, falhas, incompatibilidades com determinados aparelhos ou navegadores, interrupções e alterações de funcionamento, inclusive em razão de atualizações automáticas. Os dados armazenados podem ser perdidos, entre outras hipóteses, pela limpeza dos dados do navegador, pela desinstalação do aplicativo, por defeito, perda, furto ou troca do aparelho. <strong>É responsabilidade exclusiva do usuário realizar cópias de segurança periódicas</strong> (função “Backup de todas”) e conferir cada laudo gerado. A disponibilidade do endereço de acesso depende de serviços de terceiros e pode ser suspensa ou encerrada a qualquer tempo, sem aviso prévio.</p>

    <h3>6. Ditado por voz</h3>

      <li>o uso do microfone depende de autorização concedida pelo próprio usuário no navegador ou no aparelho, e pode ser revogada a qualquer tempo;</li>

let laudosNaPasta = [];
async function listarPasta(h) {
  const alvo = $('#lista-pasta');
  if (!alvo) return;
  if ((await h.queryPermission({ mode: 'readwrite' })) !== 'granted') {
    alvo.innerHTML = `<p class="muted">É preciso permitir que o aplicativo acesse a pasta "${esc(h.name)}".</p>
      <button class="btn primary" data-act="permitirpasta">Permitir acesso</button>`;
    return;
  }
  alvo.innerHTML = '<p class="muted">Lendo a pasta…</p>';
  const achados = [];
  try {
    for await (const [nome, fh] of h.entries()) {
      if (fh.kind !== 'file' || !/\.(json|txt)$/i.test(nome)) continue;
      try {
        const f = await fh.getFile();
        const p = lerPacote(await f.text(), true);
        if (p && !p.backup) p.vistorias.forEach(v => achados.push({ v, autor: p.autor, responsavel: p.responsavel, arquivo: nome, mod: f.lastModified }));
      } catch { /* arquivo que não é laudo: ignora */ }
    }
  } catch (err) {
    alvo.innerHTML = `<p class="aviso">Não foi possível ler a pasta (${esc(err.message)}).</p>`;
    return;
  }
  achados.sort((a, b) => b.mod - a.mod);
  laudosNaPasta = achados;
  const locais = new Set((await dbAll()).map(v => v.id));
  alvo.innerHTML = achados.length ? `<ul class="lista">${achados.map((a, i) => `
    <li>
      <div><strong>${esc(enderecoCompleto(a.v) || '(sem endereço)')}</strong>${locais.has(a.v.id) ? '<span class="tag">já importado</span>' : ''}
        <small>${TIPOS[a.v.tipo]} · ${fmtData(a.v.data)} · ${a.v.comodos.length} cômodo(s)${a.autor ? ' · por ' + esc(a.autor) : ''}</small>
        <small>Arquivo ${esc(a.arquivo)} · alterado em ${new Date(a.mod).toLocaleString('pt-BR')}</small></div>
      <button class="btn primary" data-act="importarpasta" data-i="${i}">Importar para edição</button>
    </li>`).join('')}</ul>`
    : '<p class="muted">Nenhum laudo nesta pasta ainda. Os laudos aparecem aqui quando alguém usa "Enviar p/ edição" com esta mesma pasta.</p>';
}

// valor por m² mostrado ao lado dos valores (usa a área privativa; sem ela, a área total)
function valorM2(v) {
  const area = numeroBR(v.av.areaPrivativa) || numeroBR(v.av.areaTotal);
  const calc = k => { const val = numeroBR(v.av[k]); return area && val ? `R$ ${moeda(val / area)}/m²` : ''; };
  return { area, venda: calc('valorVenda'), locacao: calc('valorLocacao') };
}
function textoValorM2(v) {
  const m = valorM2(v);
  if (!m.area) return 'Informe a área privativa ou total para calcular o valor por m².';
  return [m.venda && `Venda: ${m.venda}`, m.locacao && `Locação: ${m.locacao}`].filter(Boolean).join(' · ') || '';
}

// Bloco de uma parte (locador, locatário ou fiador): nome, CPF/CNPJ e endereço.
// Do 2º em diante, pode-se marcar "mesmo endereço do 1º".
function blocoParte(cat, i) {
  const lista = cur.partes[cat], p = lista[i];
  const removivel = CATEGORIAS[cat].opcional || i > 0;
  const comEndereco = CATEGORIAS[cat].endereco !== false;
  const campo = (k, rotulo, cls = '', attrs = '') =>
    `<label class="${cls}">${rotulo}<input data-p="${cat}.${i}.${k}" value="${esc(p[k])}" ${attrs}></label>`;
  const repetido = i > 0 && p.mesmoEndereco;
  if (!comEndereco) return `<div class="parte" id="parte-${cat}-${i}">
    <div class="row between parte-topo">
      <strong>${rotuloParte(cat, i)}</strong>
      ${removivel ? `<button class="btn danger" data-act="remparte" data-cat="${cat}" data-i="${i}">Remover</button>` : ''}
    </div>
    <div class="g-partes">
      ${campo('nome', 'Nome completo')}
      ${campo('doc', 'CPF/CNPJ')}
    </div>
  </div>`;
  return `<div class="parte" id="parte-${cat}-${i}">
    <div class="row between parte-topo">
      <strong>${rotuloParte(cat, i)}</strong>
      ${removivel ? `<button class="btn danger" data-act="remparte" data-cat="${cat}" data-i="${i}">Remover</button>` : ''}
    </div>
    <div class="g-partes">
      ${campo('nome', 'Nome completo')}
      ${campo('doc', 'CPF/CNPJ')}
    </div>
    ${i > 0 ? `<label class="check"><input type="checkbox" data-pm="${cat}.${i}" ${repetido ? 'checked' : ''}>
      <span>Mesmo endereço do(a) ${CATEGORIAS[cat].um.toLowerCase()} 1</span></label>` : ''}
    ${repetido
      ? `<p class="muted end-repetido" data-rep="${cat}">📍 ${esc(enderecoParte(lista, i) || 'O endereço do(a) ' + CATEGORIAS[cat].um.toLowerCase() + ' 1 ainda não foi preenchido.')}</p>`
      : `<div class="g-end">
      ${campo('rua', 'Endereço (rua / logradouro)', 'c-rua')}
      ${campo('numero', 'Número', 'c-num', 'inputmode="numeric"')}
      ${campo('complemento', 'Complemento', 'c-meio')}
      ${campo('bairro', 'Bairro', 'c-meio')}
      ${campo('cidade', 'Cidade', 'c-rua')}
      ${campo('uf', 'UF', 'c-num', 'maxlength="2" class="uf" autocapitalize="characters"')}
    </div>`}
  </div>`;
}

function painelComodo() {
  const c = cur.comodos[tab];
  if (!c) return '<p class="muted">Escolha acima o primeiro cômodo a vistoriar.</p>';
  return `<div class="painel">
    <div class="grid">
      <label>Nome do cômodo<input data-cf="nome" value="${esc(c.nome)}"></label>
      <label>Estado geral<select data-cf="estado">${ESTADOS.map(e => `<option value="${e}" ${e === c.estado ? 'selected' : ''}>${e || '—'}</option>`).join('')}</select></label>
      <label class="full">${ehRessalvas(cur) ? 'Divergências constatadas (descreva o que difere do laudo do locador e registre com fotos)' : ehOcorrencia(cur) ? 'Problema constatado neste cômodo / área (localização, extensão, aspecto, danos causados…)' : 'Descrição (piso, paredes, teto, portas, janelas, instalações elétricas e hidráulicas, avarias…)'}
        <textarea data-cf="descricao" rows="7">${esc(c.descricao)}</textarea></label>
      ${botaoDitar('[data-cf="descricao"]', 'full')}
    </div>
    <div class="row">
      <label class="btn primary">📷 Tirar foto<input type="file" accept="image/*" capture="environment" data-file hidden></label>
      <label class="btn">🖼️ Escolher fotos<input type="file" accept="image/*" multiple data-file hidden></label>
      <span id="proc" class="muted"></span>
    </div>
    <div class="fotos">${c.fotos.map((f, i) => `
      <figure>
        <img src="${f.data}" alt="Foto ${i + 1}">${f.em ? `<span class="foto-data">${fmtDataHora(f.em)}</span>` : ''}
        <div class="legenda"><input data-pf="${i}" placeholder="Legenda da foto ${i + 1}" value="${esc(f.legenda)}">${botaoDitar(`[data-pf="${i}"]`, 'mini')}</div>
        <button class="x" data-act="delfoto" data-i="${i}" title="Remover foto">×</button>
      </figure>`).join('')}</div>
    <div class="row between">
      <div class="row">
        <button class="btn" data-act="mover" data-d="-1">◀ Mover</button>
        <button class="btn" data-act="mover" data-d="1">Mover ▶</button>
      </div>
      <button class="btn danger" data-act="delcomodo">Excluir cômodo</button>
    </div>
  </div>`;
}

// ---------- Eventos ----------
let cfgT = null, cfgPend = {};
app.addEventListener('input', e => {
  const t = e.target;
  // se a pessoa digitar no campo durante o ditado, o ditado para e o que ela digitou é mantido
  if (ditado && e.isTrusted && t === ditado.campo) { ditado.editado = true; pararDitado(); }
  if (t.hasAttribute('data-busca')) {
    const q = chave(t.value);
    app.querySelectorAll('.lista li[data-texto]').forEach(li => { li.hidden = q && !li.dataset.texto.includes(q); });
    return;
  }
  if (t.dataset.cfg) {
    cfgPend[t.dataset.cfg] = t.value;
    clearTimeout(cfgT);
    cfgT = setTimeout(async () => {
      const mud = cfgPend; cfgPend = {};
      await cfgPut(Object.assign(await cfgGet(), mud)); flash('Salvo ✓');
    }, 400);
    return;
  }
  if (!cur) return;
  if (t.dataset.o) {
    cur.oc[t.dataset.o] = t.value;
    salvar();
    if (t.dataset.o === 'solicitanteProprio') telaEditor(); // mostra ou esconde os dados do solicitante
    return;
  }
  if (t.dataset.r) {
    cur.rs[t.dataset.r] = t.dataset.r === 'prazoDias' ? (t.value = t.value.replace(/\D/g, '').slice(0, 3)) : t.value;
    const p = $('#prazo-rs'); if (p) p.textContent = textoPrazo(cur);
    // a declaração padrão traz a data de recebimento: atualiza se o texto não foi ajustado à mão
    if (t.dataset.r === 'dataRecebimento' && !(cur.declaracao || '').trim()) {
      const d = app.querySelector('[data-f="declaracao"]'); if (d) d.value = declaracaoPadrao(cur);
    }
    salvar(); return;
  }
  if (t.dataset.a) {
    const k = t.dataset.a;
    cur.av[k] = t.value;
    if (k === 'finalidade') {
      // a declaração padrão muda com a finalidade (menção ao art. 872 do CPC)
      if ((cur.declaracao || '').trim() && confirm('O texto da declaração foi ajustado neste laudo. Deseja substituí-lo pelo texto padrão da nova finalidade?')) cur.declaracao = '';
      salvar(); return telaEditor();
    }
    if (['valorVenda', 'valorLocacao', 'areaPrivativa', 'areaTotal'].includes(k)) { const el = $('#valor-m2'); if (el) el.textContent = textoValorM2(cur); }
    salvar(); return;
  }
  if (t.dataset.p) {
    const [cat, i, k] = t.dataset.p.split('.');
    if (k === 'uf') t.value = limparUF(t.value);
    cur.partes[cat][+i][k] = t.value;
    // quem repete o endereço do 1º vê a mudança na hora
    if (+i === 0) app.querySelectorAll(`[data-rep="${cat}"]`).forEach(el => {
      el.textContent = '📍 ' + (enderecoParte(cur.partes[cat], 0) || `O endereço do(a) ${CATEGORIAS[cat].um.toLowerCase()} 1 ainda não foi preenchido.`);
    });
    salvar(); return;
  }
  if (t.dataset.f) {
    if (t.dataset.f === 'uf') t.value = t.value.toUpperCase().replace(/[^A-Z]/g, '').slice(0, 2);
    cur[t.dataset.f] = t.value;
    if (t.dataset.f === 'declaracao') {
      const s = $('#decl-status');
      if (s) s.textContent = t.value.trim() ? 'Texto ajustado para esta vistoria.' : 'Campo vazio: será usado o texto padrão.';
    }
    if (t.dataset.f === 'tipo' || t.dataset.f === 'acompanhou') {
      // o texto padrão muda com a opção; se o usuário tinha ajustado o texto, pergunta antes de trocar
      if ((cur.declaracao || '').trim() && confirm('O texto da declaração foi ajustado nesta vistoria. Deseja substituí-lo pelo texto padrão da nova opção?')) cur.declaracao = '';
      salvar(); return telaEditor();
    }
  } else if (t.dataset.cf) {
    cur.comodos[tab][t.dataset.cf] = t.value;
    if (t.dataset.cf === 'nome') {
      cur.comodos[tab].base = null; // nome escolhido à mão: não entra na numeração automática
      const s = app.querySelector('.tab.on span'); if (s) s.textContent = t.value || 'Sem nome';
    }
  } else if (t.dataset.pf) {
    cur.comodos[tab].fotos[+t.dataset.pf].legenda = t.value;
  } else return;
  salvar();
});

app.addEventListener('change', async e => {
  const t = e.target;
  if (t.id === 'concordo') { $('[data-act=aceitar]').disabled = !t.checked; return; }
  if (t.hasAttribute('data-fotodata')) { cur.fotoDataHora = t.checked; salvar(); return; }
  if (t.hasAttribute('data-moeda')) {
    // ao sair do campo de valor, formata: 450000 -> 450.000,00
    const n = numeroBR(t.value);
    t.value = n === null ? '' : moeda(n);
    cur.av[t.dataset.a] = t.value; salvar();
    const el = $('#valor-m2'); if (el) el.textContent = textoValorM2(cur);
    return;
  }
  if (t.dataset.pm) {
    const [cat, i] = t.dataset.pm.split('.');
    cur.partes[cat][+i].mesmoEndereco = t.checked;
    salvar(); telaEditor(); return;
  }
  if (t.dataset.cf === 'nome') {
    // ao sair do campo de nome: renumera os demais e atualiza só os rótulos das abas
    // (sem redesenhar a tela, para não perder o clique que tirou o foco do campo)
    renumerar(cur); salvar();
    app.querySelectorAll('.tab[data-i]').forEach(b => { b.querySelector('span').textContent = cur.comodos[+b.dataset.i].nome || 'Sem nome'; });
    return;
  }
  if (t.hasAttribute('data-logo') && t.files.length) {
    try {
      const c = await cfgGet();
      c.logo = await comprimir(t.files[0], 800, 1, 'image/png'); // PNG preserva fundo transparente
      await cfgPut(c); flash('Logo salvo ✓'); telaCadastro();
    } catch { alert('Não foi possível ler a imagem do logo.'); }
    return;
  }
  if (!t.hasAttribute('data-file') || !t.files.length) return;
  const c = cur.comodos[tab], files = [...t.files], p = $('#proc');
  for (let i = 0; i < files.length; i++) {
    p.textContent = `Processando foto ${i + 1} de ${files.length}…`;
    try {
      const em = await dataDaFoto(files[i]); // antes de comprimir: a compressão descarta os dados da câmera
      const r = await comprimir(files[i]);
      c.fotos.push({ id: uid(), legenda: '', em, ...r });
    } catch { alert('Não foi possível ler o arquivo ' + files[i].name); }
  }
  await flush();
  telaEditor();
});

app.addEventListener('click', async e => {
  const b = e.target.closest('[data-act]');
  if (!b) return;
  const d = b.dataset;
  switch (d.act) {
    case 'nova': {
      const v = novaVistoria(d.tipo); await dbPut(v);
      cur = v; tab = 0; scrollTo(0, 0); ir('vistoria/' + v.id); break;
    }
    case 'derivarressalvas': {
      // ressalvas do locatário a partir de um laudo prévio: mesmo imóvel, partes e cômodos (sem descrições)
      const o = migrar(await dbGet(d.id));
      const v = novaVistoria('ressalvas');
      for (const k of ['rua', 'numero', 'complemento', 'bairro', 'cidade', 'uf', 'contrato']) v[k] = o[k];
      v.partes.locadores = structuredClone(o.partes.locadores);
      v.partes.locatarios = structuredClone(o.partes.locatarios);
      v.rs.dataOriginal = o.data || '';
      v.rs.responsavelOriginal = o.vistoriador || '';
      v.comodos = o.comodos.map(c => novoComodo(c.nome, baseDe(c)));
      await dbPut(v); cur = v; tab = 0; scrollTo(0, 0); ir('vistoria/' + v.id); break;
    }
    case 'derivar': {
      const o = migrar(await dbGet(d.id));
      const v = novaVistoria('entrega');
      for (const k of ['rua', 'numero', 'complemento', 'bairro', 'cidade', 'uf', 'contrato', 'vistoriador']) v[k] = o[k];
      v.partes = structuredClone(o.partes);
      v.comodos = o.comodos.map(c => novoComodo(c.nome, baseDe(c)));
      await dbPut(v); cur = v; tab = 0; scrollTo(0, 0); ir('vistoria/' + v.id); break;
    }
    case 'excluir':
      if (confirm('Excluir esta vistoria definitivamente? (faça um backup antes, se necessário)')) { await dbDel(d.id); telaVistorias(); }
      break;
    case 'enviar': {
      if (cur) await flush();
      const v = cur && cur.id === d.id ? cur : migrar(await dbGet(d.id));
      await abrirEnvio(v); break;
    }
    case 'backuptodas': {
      if (cur) await flush();
      const todas = (await dbAll()).map(migrar);
      // inclui o cadastro do responsável (logo, nome e contato), restaurado junto ao importar
      baixar(new Blob([JSON.stringify(await pacote(todas, true))], { type: 'application/json' }), `Backup-vistorias-${hoje()}.json`);
      await cfgGravar({ id: 'ultimoBackup', em: Date.now() });
      alert(`Backup salvo no aparelho (normalmente na pasta Downloads), com ${todas.length} laudo(s) e o cadastro do responsável.\n\n` +
        'Guarde uma cópia fora do celular (Drive, e-mail, computador). Para restaurar: Laudos de outras pessoas → Importar arquivo.');
      if (location.hash === '#/inicio' || !location.hash) telaInicio();
      break;
    }
    case 'importararquivo': {
      const i = document.createElement('input');
      i.type = 'file'; i.multiple = true; i.accept = '.json,.txt,application/json,text/plain';
      i.onchange = async () => {
        const importadas = [];
        for (const f of i.files) {
          let p;
          try { p = lerPacote(await f.text()); } catch { alert(`O arquivo "${f.name}" não é um laudo válido deste aplicativo.`); continue; }
          if (p.backup) {
            // cópia de segurança: restaura vistorias e cadastro, sem marcar como "recebido de"
            const r = await restaurarBackup(p);
            alert(`Backup restaurado: ${r.n} laudo(s) importado(s)${r.cadastro ? ' e cadastro do responsável restaurado' : ''}.`);
            ir('vistorias');
            return;
          }
          for (const v of p.vistorias) importadas.push(await importar(v, { autor: p.autor, arquivo: f.name, em: Date.now() }, p.responsavel));
        }
        if (importadas.length === 1) { flash('Laudo importado ✓', 3000); cur = null; ir('vistoria/' + importadas[0].id); }
        else if (importadas.length) { flash(`${importadas.length} laudos importados ✓`, 3000); ir('vistorias'); }
      };
      i.click(); break;
    }
    case 'lerpasta': case 'permitirpasta': {
      const h = await pasta('pastaCompart'); if (!h) return;
      if (d.act === 'permitirpasta') { try { await permitir(h); } catch (err) { alert(err.message); } }
      listarPasta(h); break;
    }
    case 'importarpasta': {
      const a = laudosNaPasta[+d.i]; if (!a) return;
      const v = await importar(structuredClone(a.v), { autor: a.autor, arquivo: a.arquivo, em: Date.now() }, a.responsavel);
      flash('Laudo importado ✓', 3000); cur = null; ir('vistoria/' + v.id); break;
    }
    case 'addparte': {
      const lista = cur.partes[d.cat];
      lista.push(novaParte());
      salvar(); telaEditor();
      // abre direto o campo de nome da nova parte
      const novo = app.querySelector(`[data-p="${d.cat}.${lista.length - 1}.nome"]`);
      if (novo) { novo.scrollIntoView({ block: 'center' }); novo.focus({ preventScroll: true }); }
      break;
    }
    case 'remparte': {
      const lista = cur.partes[d.cat], i = +d.i, p = lista[i];
      if (!confirm(`Remover ${rotuloParte(d.cat, i).toLowerCase()}${p.nome ? ` "${p.nome}"` : ''}?`)) return;
      // se sai o 1º e o seguinte repetia o endereço dele, o seguinte herda o endereço
      if (i === 0 && lista[1] && lista[1].mesmoEndereco) {
        for (const k of ['rua', 'numero', 'complemento', 'bairro', 'cidade', 'uf']) lista[1][k] = p[k];
        lista[1].mesmoEndereco = false;
      }
      lista.splice(i, 1);
      salvar(); telaEditor(); break;
    }
    case 'ditar': {
      const mesmo = ditado && ditado.botao === b;
      if (ditado) pararDitado();
      if (!mesmo) iniciarDitado(b);
      break;
    }
    case 'aceitar':
      if (!$('#concordo').checked) return;
      await cfgGravar({ id: 'aceite', versao: TERMOS_VERSAO, em: Date.now() });
      flash('Termos aceitos ✓', 3000);
      rotear(); break;
    case 'escolherpasta':
      if (await escolherPasta(d.id)) { flash('Pasta definida ✓', 3000); telaConfig(); }
      break;
    case 'removerpasta':
      await tx('readwrite', s => s.delete(d.id), CONFIG); telaConfig(); break;
    case 'instalar':
      if (!pedidoInstalacao) return;
      pedidoInstalacao.prompt();
      await pedidoInstalacao.userChoice;
      pedidoInstalacao = null; atualizarInstalar(); break;
    case 'pdf': {
      // pede a permissão da pasta antes de montar o PDF, enquanto o clique ainda vale como gesto do usuário
      const h = suportaPastas ? await pasta('pastaPDF') : null;
      if (h) { try { await permitir(h); } catch { /* salvarPDF trata */ } }
      const doc = await montarPDF(); if (doc) await salvarPDF(doc, cur);
      break;
    }
    case 'compartilhar': {
      const doc = await montarPDF(); if (doc) compartilharPDF(doc, cur);
      break;
    }
    case 'previa': {
      const doc = await montarPDF(); if (doc) abrirPrevia(doc, cur);
      break;
    }
    case 'dellogo': {
      if (!confirm('Remover o logo?')) return;
      const c = await cfgGet(); c.logo = null; await cfgPut(c); telaCadastro(); break;
    }
    case 'trocarcabecalho':
      cur.usarCabecalhoRecebido = !cur.usarCabecalhoRecebido; salvar(); telaEditor(); break;
    case 'persistir':
      if (navigator.storage && navigator.storage.persist) await navigator.storage.persist();
      telaConfig(); break;
    case 'restaurardecl':
      if ((cur.declaracao || '').trim() && !confirm('Descartar os ajustes e voltar ao texto padrão?')) return;
      cur.declaracao = ''; salvar(); telaEditor(); break;
    case 'tab':
      tab = +d.i; telaEditor(); break;
    case 'addmenu':
      $('#addmenu').hidden = !$('#addmenu').hidden; break;
    case 'add': {
      let nome = d.nome;
      if (!nome) {
        nome = (prompt('Nome do cômodo:') || '').trim(); if (!nome) return;
        nome = nome.charAt(0).toLocaleUpperCase('pt-BR') + nome.slice(1);
      }
      // se já existe cômodo desse tipo, usa a mesma grafia para agrupar ("banheiro" -> "Banheiro")
      const igual = cur.comodos.find(c => chave(baseDe(c)) === chave(nome));
      cur.comodos.push(novoComodo(nome, igual ? baseDe(igual) : nome));
      renumerar(cur);
      tab = cur.comodos.length - 1; salvar(); telaEditor(); break;
    }
    case 'mover': {
      const j = tab + +d.d;
      if (j < 0 || j >= cur.comodos.length) return;
      [cur.comodos[tab], cur.comodos[j]] = [cur.comodos[j], cur.comodos[tab]];
      renumerar(cur);
      tab = j; salvar(); telaEditor(); break;
    }
    case 'delcomodo':
      if (!confirm(`Excluir o cômodo "${cur.comodos[tab].nome}" e todas as suas fotos?`)) return;
      cur.comodos.splice(tab, 1); renumerar(cur); tab = Math.max(0, tab - 1); salvar(); telaEditor(); break;
    case 'delfoto':
      if (!confirm('Remover esta foto?')) return;
      cur.comodos[tab].fotos.splice(+d.i, 1); salvar(); telaEditor(); break;
  }
});

// ---------- PDF: salvar, visualizar, compartilhar ----------
const nomePDF = v => `${{ previa: 'Vistoria-previa', entrega: 'Vistoria-entrega', ressalvas: 'Ressalvas-locatario', ocorrencia: 'Constatacao-problema', avaliacao: 'Avaliacao' }[v.tipo]}-${slug(enderecoCompleto(v)) || 'imovel'}-${v.data}.pdf`;
async function montarPDF() {
  await flush();
  try { return gerarPDF(cur, await cfgGet()); }
  catch (err) { console.error(err); alert('Erro ao gerar o PDF: ' + err.message); return null; }
}

// Grava na pasta escolhida em Configurações (computador); sem pasta, baixa para Downloads.
async function salvarPDF(doc, v) {
  const h = suportaPastas ? await pasta('pastaPDF') : null;
  if (h) {
    try {
      if (await permitir(h)) {
        await gravarNaPasta(h, nomePDF(v), doc.output('blob'));
        flash(`PDF salvo na pasta "${h.name}" ✓`, 4000);
        return;
      }
      alert('Sem permissão para gravar na pasta escolhida. O PDF será baixado para a pasta Downloads.');
    } catch (err) {
      alert(`Não foi possível gravar na pasta "${h.name}" (${err.message}). O PDF será baixado para a pasta Downloads.`);
    }
  }
  doc.save(nomePDF(v));
}

async function compartilharPDF(doc, v) {
  const arquivo = new File([doc.output('blob')], nomePDF(v), { type: 'application/pdf' });
  if (navigator.canShare && navigator.canShare({ files: [arquivo] })) {
    try {
      await navigator.share({ files: [arquivo], title: 'Laudo de vistoria', text: `Laudo de vistoria - ${enderecoCompleto(v)}` });
    } catch (err) {
      if (err.name !== 'AbortError') alert('Não foi possível compartilhar: ' + err.message); // AbortError = usuário cancelou
    }
  } else {
    await salvarPDF(doc, v);
    alert('Este navegador não permite compartilhar arquivos diretamente.\nO PDF foi salvo no aparelho; anexe-o pelo WhatsApp, e-mail etc.');
  }
}

// A prévia é desenhada na própria página com o pdf.js, porque os celulares
// (principalmente Android) não exibem PDF gerado no navegador: apenas baixam o arquivo.
const PDFJS = 'lib/';
function carregarPdfJs() {
  if (window.pdfjsLib) return Promise.resolve();
  return new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = PDFJS + 'pdf.min.js';
    s.onload = () => { pdfjsLib.GlobalWorkerOptions.workerSrc = PDFJS + 'pdf.worker.min.js'; res(); };
    s.onerror = () => rej(new Error('sem conexão com a internet'));
    document.head.appendChild(s);
  });
}
async function abrirPrevia(doc, v) {
  const ov = document.createElement('div');
  ov.className = 'previa';
  ov.innerHTML = `
    <div class="previa-barra">
      <strong>Prévia do laudo</strong>
      <div class="row">
        <button class="btn" data-p="compartilhar">📤 Compartilhar</button>
        <button class="btn primary" data-p="salvar">⬇️ Salvar PDF</button>
        <button class="btn" data-p="fechar">✕ Fechar</button>
      </div>
    </div>
    <div class="previa-paginas"><p class="muted">Gerando prévia…</p></div>`;
  document.body.appendChild(ov);
  document.body.style.overflow = 'hidden';
  const fechar = () => { ov.remove(); document.body.style.overflow = ''; document.removeEventListener('keydown', teclaEsc); };
  const teclaEsc = e => { if (e.key === 'Escape') fechar(); };
  document.addEventListener('keydown', teclaEsc);
  ov.addEventListener('click', e => {
    const a = e.target.closest('[data-p]'); if (!a) return;
    if (a.dataset.p === 'fechar') fechar();
    if (a.dataset.p === 'salvar') salvarPDF(doc, v);
    if (a.dataset.p === 'compartilhar') compartilharPDF(doc, v);
  });
  const area = ov.querySelector('.previa-paginas');
  try {
    await carregarPdfJs();
    const pdf = await pdfjsLib.getDocument({ data: doc.output('arraybuffer') }).promise;
    area.innerHTML = '';
    // se a área ainda não tiver largura medida (página em segundo plano), usa a da janela
    const larg = Math.max(240, Math.min((area.clientWidth || window.innerWidth || 800) - 24, 900));
    for (let p = 1; p <= pdf.numPages; p++) {
      if (!ov.isConnected) return; // fechou antes de terminar
      const pg = await pdf.getPage(p);
      const escala = larg / pg.getViewport({ scale: 1 }).width;
      const vp = pg.getViewport({ scale: escala * (window.devicePixelRatio || 1) });
      const cv = document.createElement('canvas');
      cv.width = vp.width; cv.height = vp.height;
      cv.style.width = larg + 'px';
      area.appendChild(cv);
      await pg.render({ canvasContext: cv.getContext('2d'), viewport: vp }).promise;
    }
  } catch (err) {
    area.innerHTML = `<p class="muted">Não foi possível gerar a prévia (${esc(err.message)}). Use "Salvar PDF" e abra o arquivo.</p>`;
  }
}

// ---------- PDF: montagem ----------
function gerarPDF(v, cfg) {
  migrar(v);
  // laudo recebido em que se escolheu manter o cabeçalho de quem enviou
  if (v.usarCabecalhoRecebido && v.cabecalhoRecebido) cfg = v.cabecalhoRecebido;
  if (!window.jspdf) { alert('A biblioteca de PDF não carregou. Verifique a conexão com a internet e recarregue a página.'); return null; }
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit: 'mm', format: 'a4', compress: true });
  const W = 210, H = 297, M = 15, CW = W - 2 * M, TOP = 20, BOT = H - 18;
  let y = TOP, n = 1;

  const font = (s, st = 'normal') => { doc.setFont('helvetica', st); doc.setFontSize(s); };
  const novaPag = () => { doc.addPage(); y = TOP; };
  const ensure = h => { if (y + h > BOT) novaPag(); };
  // Largura real do texto como o PDF o desenha. O getTextWidth do jsPDF desconta kerning
  // (ex.: "AT", "TA"), mas o texto é impresso sem kerning; por isso medimos letra por letra.
  const larg = s => { let u = 0; for (const ch of s) u += doc.getStringUnitWidth(ch); return u * doc.getFontSize() / doc.internal.scaleFactor; };
  const quebrar = (txt, maxW) => {
    const linhas = [];
    let atual = '';
    for (const w of String(txt).split(/\s+/).filter(Boolean)) {
      const tentativa = atual ? atual + ' ' + w : w;
      if (!atual || larg(tentativa) <= maxW) atual = tentativa;
      else { linhas.push(atual); atual = w; }
    }
    if (atual) linhas.push(atual);
    return linhas.length ? linhas : [''];
  };
  // linha justificada: distribui o espaço que sobra entre as palavras
  const linhaJustificada = (l, yy) => {
    const ws = l.trim().split(/\s+/);
    if (ws.length < 2) return doc.text(l, M, yy);
    const gap = (CW - ws.reduce((a, w) => a + larg(w), 0)) / (ws.length - 1);
    let x = M;
    for (const w of ws) { doc.text(w, x, yy); x += larg(w) + gap; }
  };
  const para = (txt, s = 10, st = 'normal', justificar = false) => {
    font(s, st);
    const lh = s * 0.3528 * 1.45;
    for (const bloco of String(txt).split('\n')) {
      const linhas = quebrar(bloco, CW);
      linhas.forEach((l, i) => {
        ensure(lh);
        // a última linha de cada parágrafo fica alinhada à esquerda, como em editores de texto
        if (justificar && i < linhas.length - 1) linhaJustificada(l, y + lh * 0.75);
        else doc.text(l, M, y + lh * 0.75);
        y += lh;
      });
    }
  };
  const texto = txt => para(txt, 10, 'normal', true);
  const secao = t => {
    ensure(16);
    doc.setFillColor(232, 237, 245); doc.rect(M, y, CW, 8, 'F');
    font(11, 'bold'); doc.setTextColor(30, 41, 59); doc.text(t, M + 2.5, y + 5.5); doc.setTextColor(0);
    y += 11;
  };
  const campo = (rotulo, valor) => {
    if (!valor) return;
    font(10);
    const linhas = quebrar(valor, CW - 52), lh = 4.9;
    ensure(linhas.length * lh + 1.5);
    font(10, 'bold'); doc.text(rotulo, M, y + 3.7);
    font(10); linhas.forEach((l, i) => doc.text(l, M + 52, y + 3.7 + i * lh));
    y += linhas.length * lh + 1.5;
  };
  // parte: nome e CPF/CNPJ em colunas fixas, para ficarem alinhados entre locatário e locador
  // o endereço, quando houver, vai logo abaixo do nome, em letra menor
  const parte = (rotulo, nome, docu, endereco) => {
    if (!nome && !docu && !endereco) return;
    font(10);
    const linhas = quebrar(nome || '', 72), lh = 4.9;
    font(8.5);
    const linhasEnd = endereco ? quebrar(endereco, CW - 52) : [], lhEnd = 3.9;
    ensure(linhas.length * lh + linhasEnd.length * lhEnd + 2.5);
    font(10, 'bold'); doc.text(rotulo, M, y + 3.7);
    if (docu) doc.text('CPF/CNPJ:', M + 128, y + 3.7);
    font(10); linhas.forEach((l, i) => doc.text(l, M + 52, y + 3.7 + i * lh));
    if (docu) doc.text(docu, M + 148, y + 3.7);
    y += linhas.length * lh;
    if (linhasEnd.length) {
      font(8.5); doc.setTextColor(80);
      linhasEnd.forEach((l, i) => doc.text(l, M + 52, y + 2.9 + i * lhEnd));
      doc.setTextColor(0);
      y += linhasEnd.length * lhEnd + 0.6;
    }
    y += 1.5;
  };
  const partesDe = cat => {
    const lista = v.partes[cat];
    lista.forEach((p, i) => parte(CATEGORIAS[cat].um + (lista.length > 1 ? ` ${i + 1}` : '') + ':', p.nome, p.doc, enderecoParte(lista, i)));
  };

  // Cabeçalho do laudo (logo, nome e contato de quem elabora a vistoria)
  const logo = cfg && cfg.logo;
  if (logo || (cfg && (cfg.nome || cfg.contato))) {
    let lw = 0, lh = 0;
    if (logo) { lh = 22; lw = lh * logo.w / logo.h; if (lw > 50) { lw = 50; lh = lw * logo.h / logo.w; } doc.addImage(logo.data, 'PNG', M, y, lw, lh, 'logo'); }
    const tx0 = M + (lw ? lw + 6 : 0), tw = CW - (tx0 - M);
    let ty = y + 5;
    if (cfg.nome) { font(12, 'bold'); doc.text(doc.splitTextToSize(cfg.nome, tw)[0], tx0, ty); ty += 5.5; }
    if (cfg.contato) { font(8.5); doc.setTextColor(80); doc.splitTextToSize(cfg.contato, tw).slice(0, 4).forEach(l => { doc.text(l, tx0, ty); ty += 3.8; }); doc.setTextColor(0); }
    y = Math.max(y + lh, ty) + 3;
    doc.setDrawColor(180); doc.line(M, y, W - M, y);
    y += 7;
  }

  // Capa / identificação
  font(15, 'bold');
  doc.text(TITULO_PDF[v.tipo], W / 2, y + 6, { align: 'center' });
  y += 11;
  font(10); doc.setTextColor(90); doc.text(`Data da vistoria: ${fmtData(v.data)}`, W / 2, y + 3, { align: 'center' });
  if (ehJudicial(v) && v.av.processo) { y += 5; doc.text(`Processo nº ${v.av.processo}`, W / 2, y + 3, { align: 'center' }); }
  doc.setTextColor(0);
  y += 10;

  if (ehAvaliacao(v)) {
    const av = v.av;
    secao(`${n++}. IDENTIFICAÇÃO DO LAUDO`);
    campo('Finalidade:', FINALIDADES[av.finalidade]);
    if (ehJudicial(v)) {
      campo('Processo nº:', av.processo);
      campo('Juízo/Vara:', av.vara);
      campo('Comarca:', av.comarca);
      y += 2; partesDe('ativo'); partesDe('passivo');
    } else {
      y += 2; partesDe('solicitantes'); partesDe('proprietarios');
    }
    y += 2;
    campo('Referência:', v.contrato);
    campo('Avaliador(a):', [v.vistoriador, av.registroAvaliador].filter(Boolean).join(' - '));
    campo('Data da vistoria:', fmtData(v.data));
    campo('Acompanhamento:', av.acompanhante);
    y += 3;

    secao(`${n++}. IDENTIFICAÇÃO E CARACTERIZAÇÃO DO IMÓVEL`);
    campo('Endereço:', (v.rua || '') + (v.numero ? ', nº ' + v.numero : ''));
    campo('Complemento:', v.complemento);
    campo('Bairro:', v.bairro);
    campo('Cidade/UF:', cidadeUF(v));
    campo('Matrícula:', [av.matricula && 'nº ' + av.matricula, av.cartorio].filter(Boolean).join(' - '));
    campo('Inscrição municipal:', av.inscricao);
    y += 2;
    const m2 = s => s ? `${s} m²` : '';
    campo('Tipo de imóvel:', av.tipoImovel);
    campo('Uso:', av.uso);
    campo('Área privativa/útil:', m2(av.areaPrivativa));
    campo('Área total/construída:', m2(av.areaTotal));
    campo('Área do terreno:', m2(av.areaTerreno));
    campo('Pavimentos:', av.pavimentos);
    campo('Andar:', av.andar);
    campo('Compartimentos:', [av.quartos && `${av.quartos} quarto(s)`, av.suites && `${av.suites} suíte(s)`,
      av.banheiros && `${av.banheiros} banheiro(s)`, av.vagas && `${av.vagas} vaga(s) de garagem`].filter(Boolean).join(', '));
    campo('Idade aproximada:', av.idade ? `${av.idade} anos` : '');
    campo('Padrão de acabamento:', av.padrao);
    campo('Estado de conservação:', av.conservacao);
    campo('Ocupação:', av.ocupacao);
    if (av.entorno.trim()) { y += 2; para('Entorno e infraestrutura:', 10, 'bold'); texto(av.entorno); }
    y += 3;
  } else if (ehOcorrencia(v)) {
    const oc = v.oc;
    secao(`${n++}. IDENTIFICAÇÃO`);
    campo('Endereço:', (v.rua || '') + (v.numero ? ', nº ' + v.numero : ''));
    campo('Complemento:', v.complemento);
    campo('Bairro:', v.bairro);
    campo('Cidade/UF:', cidadeUF(v));
    campo('Referência:', v.contrato);
    y += 2;
    partesDe('donos');
    if (solicitanteEhProprietario(v)) campo('Solicitante:', 'O(A) proprietário(a)');
    else {
      partesDe('solicitantes');
      campo('Qualidade do solicitante:', oc.qualidade);
    }
    y += 2;
    campo('Vistoriador(a):', [v.vistoriador, oc.registro].filter(Boolean).join(' - '));
    campo('Data da vistoria:', fmtData(v.data));
    y += 3;
    secao(`${n++}. PROBLEMA CONSTATADO`);
    campo('Tipo de problema:', oc.problema);
    campo('Percebido em:', fmtData(oc.dataIdentificacao));
    campo('Urgência:', oc.urgencia);
    if (oc.descricao.trim()) { y += 2; para('Descrição:', 10, 'bold'); texto(oc.descricao); }
    if (oc.origem.trim()) { y += 2; para('Origem provável (avaliação visual):', 10, 'bold'); texto(oc.origem); }
    y += 3;
  } else if (ehRessalvas(v)) {
    secao(`${n++}. IDENTIFICAÇÃO`);
    campo('Endereço:', (v.rua || '') + (v.numero ? ', nº ' + v.numero : ''));
    campo('Complemento:', v.complemento);
    campo('Bairro:', v.bairro);
    campo('Cidade/UF:', cidadeUF(v));
    campo('Contrato/referência:', v.contrato);
    y += 2;
    partesDe('locatarios');
    partesDe('locadores');
    y += 3;
    secao(`${n++}. LAUDO DE VISTORIA OBJETO DAS RESSALVAS`);
    campo('Data da vistoria:', fmtData(v.rs.dataOriginal));
    campo('Elaborado por:', v.rs.responsavelOriginal);
    campo('Recebido em:', fmtData(v.rs.dataRecebimento));
    y += 3;
    // a declaração fala das "divergências abaixo": vem antes da lista de cômodos
    secao(`${n++}. DECLARAÇÃO`);
    texto(textoDeclaracao(v));
    y += 3;
  } else {
  secao(`${n++}. IDENTIFICAÇÃO`);
  campo('Endereço:', (v.rua || v.endereco || '') + (v.numero ? ', nº ' + v.numero : ''));
  campo('Complemento:', v.complemento);
  campo('Bairro:', v.bairro);
  campo('Cidade/UF:', cidadeUF(v));
  campo('Contrato/referência:', v.contrato);
  y += 2;
  partesDe('locadores');
  partesDe('locatarios');
  partesDe('fiadores');
  campo('Vistoriador(a):', v.vistoriador);
  y += 2;
  campo('Tipo de vistoria:', TIPOS[v.tipo]);
  if (v.tipo === 'previa') campo('Acompanhamento:', semLocatario(v) ? 'Vistoria realizada sem o acompanhamento do(a) locatário(a)' : 'Vistoria acompanhada pelo(a) locatário(a)');
  y += 3;

  if (v.chaves || v.agua || v.luz || v.gas) {
    secao(`${n++}. CHAVES E MEDIDORES`);
    campo('Chaves:', v.chaves);
    campo('Hidrômetro (água):', v.agua);
    campo('Medidor de energia:', v.luz);
    campo('Medidor de gás:', v.gas);
    y += 3;
  }
  } // fim da identificação da vistoria de locação
  if (v.obs) { secao(`${n++}. OBSERVAÇÕES GERAIS`); texto(v.obs); y += 3; }

  const nComodos = n++;
  secao(`${nComodos}. ${ehRessalvas(v) ? 'CÔMODOS COM DIVERGÊNCIAS' : ehOcorrencia(v) ? 'ÁREAS AFETADAS' : 'CÔMODOS VISTORIADOS'}`);
  if (!v.comodos.length) para('Nenhum cômodo registrado.', 10, 'italic');
  v.comodos.forEach((c, i) => para(`${nComodos}.${i + 1}  ${c.nome}${c.estado ? ' - estado geral: ' + c.estado : ''}  (${c.fotos.length} foto${c.fotos.length === 1 ? '' : 's'})`));

  // Cômodo a cômodo
  let fotoN = 0;
  const GAP = 6, colW = (CW - GAP) / 2, MAXH = 80, CAP_LH = 3.6;
  v.comodos.forEach((c, i) => {
    novaPag();
    secao(`${nComodos}.${i + 1}  ${(c.nome || 'Cômodo').toUpperCase()}`);
    campo('Estado geral:', c.estado);
    if (ehRessalvas(v)) para('Divergências constatadas:', 10, 'bold');
    if (ehOcorrencia(v)) para('Problema constatado:', 10, 'bold');
    if (c.descricao.trim()) texto(c.descricao); else para(ehRessalvas(v) ? 'Sem divergências descritas.' : 'Sem descrição.', 10, 'italic');
    y += 4;
    for (let k = 0; k < c.fotos.length; k += 2) {
      const par = c.fotos.slice(k, k + 2).map(f => {
        let w = colW, h = colW * f.h / f.w;
        if (h > MAXH) { h = MAXH; w = h * f.w / f.h; }
        fotoN++;
        font(8.5);
        const quando = v.fotoDataHora && f.em ? ` (${fmtDataHora(f.em)})` : ''; // opcional: data e hora da foto
        return { f, w, h, cap: doc.splitTextToSize(`Foto ${fotoN}${f.legenda ? ' - ' + f.legenda : ''}${quando}`, colW) };
      });
      const rowH = Math.max(...par.map(p => p.h + 3 + p.cap.length * CAP_LH)) + 5;
      ensure(rowH);
      par.forEach((p, j) => {
        const x0 = M + j * (colW + GAP), x = x0 + (colW - p.w) / 2;
        doc.addImage(p.f.data, 'JPEG', x, y, p.w, p.h, p.f.id);
        doc.setDrawColor(190); doc.rect(x, y, p.w, p.h);
        font(8.5); doc.setTextColor(70);
        p.cap.forEach((l, li) => doc.text(l, x0 + colW / 2, y + p.h + 4 + li * CAP_LH, { align: 'center' }));
        doc.setTextColor(0);
      });
      y += rowH;
    }
  });

  // Providências e comunicação (constatação de problema)
  if (ehOcorrencia(v) && (v.oc.providencias.trim() || v.oc.destinatarios.trim())) {
    novaPag();
    secao(`${n++}. PROVIDÊNCIAS E COMUNICAÇÃO`);
    if (v.oc.providencias.trim()) { para('Providências recomendadas:', 10, 'bold'); texto(v.oc.providencias); y += 2; }
    campo('Destinatário(s):', v.oc.destinatarios);
    y += 6;
  }

  // Valores estimados (laudo de avaliação)
  if (ehAvaliacao(v)) {
    novaPag();
    secao(`${n++}. VALORES ESTIMADOS`);
    const m = valorM2(v);
    let algum = false;
    for (const [k, rotulo, unit] of [['valorVenda', 'Valor de mercado para venda', m.venda], ['valorLocacao', 'Valor de locação mensal', m.locacao]]) {
      const val = numeroBR(v.av[k]);
      if (val === null) continue;
      algum = true;
      ensure(30);
      para(rotulo + ':', 10, 'bold');
      font(16, 'bold'); doc.text(`R$ ${moeda(val)}`, M, y + 6); y += 9;
      para(`(${reaisPorExtenso(val)})`, 10, 'italic');
      if (unit) para(`Valor unitário: ${unit}`, 9.5);
      y += 5;
    }
    if (!algum) para('Nenhum valor informado.', 10, 'italic');
    if (v.av.metodologia.trim()) { y += 2; para('Metodologia e fundamentação:', 10, 'bold'); texto(v.av.metodologia); }
    y += 8;
  }

  // Declaração e assinaturas
  if (ehAvaliacao(v) || ehOcorrencia(v)) ensure(90); else novaPag();
  if (ehRessalvas(v)) {
    secao(`${n++}. LOCAL, DATA E ASSINATURAS`); // a declaração já veio antes dos cômodos
  } else {
    secao(`${n++}. ${ehAvaliacao(v) || ehOcorrencia(v) ? 'DECLARAÇÃO E ASSINATURA' : 'DECLARAÇÃO E ASSINATURAS'}`);
    texto(textoDeclaracao(v));
    y += 6;
  }
  // local da assinatura = cidade/UF do imóvel vistoriado; sem cidade, deixa espaço para preencher à mão
  para(`${cidadeUF(v) || '______________________/____'}, ${extenso(v.data) || '____ de ______________ de ________'}.`);
  if (semLocatario(v)) {
    // data de recebimento: marco inicial do prazo de 10 dias
    y += 8;
    para('Recebi uma via deste laudo em ____/____/________.', 10, 'bold');
  }
  y += 22;
  const assinatura = (nome, papel, docu) => {
    ensure(32);
    doc.setDrawColor(0); doc.line(M + 25, y, W - M - 25, y);
    font(10, 'bold'); doc.text(nome || ' ', W / 2, y + 5, { align: 'center' });
    font(9); doc.text(papel + (docu ? ` - CPF/CNPJ: ${docu}` : ''), W / 2, y + 9.5, { align: 'center' });
    y += 32;
  };
  if (ehAvaliacao(v)) {
    // no laudo de avaliação, só o avaliador assina
    assinatura(v.vistoriador, 'AVALIADOR(A)' + (v.av.registroAvaliador ? ` - ${v.av.registroAvaliador}` : ''));
  } else if (ehOcorrencia(v)) {
    // na constatação de problema, só o vistoriador assina
    assinatura(v.vistoriador, 'VISTORIADOR(A)' + (v.oc.registro ? ` - ${v.oc.registro}` : ''));
  } else if (ehRessalvas(v)) {
    // só os locatários assinam; o locador (ou representante) registra o recebimento
    v.partes.locatarios.forEach(p => assinatura(p.nome, 'LOCATÁRIO(A)', p.doc));
    ensure(40);
    para('Recebido por: _______________________________________________', 10, 'bold');
    y += 4;
    para('Locador(a) ou representante, em ____/____/________.', 10);
  } else {
    // uma linha para cada locatário, locador e fiador (fiador em branco não gera linha)
    for (const cat of ['locatarios', 'locadores', 'fiadores']) {
      v.partes[cat].forEach(p => {
        if (cat === 'fiadores' && !p.nome && !p.doc) return;
        assinatura(p.nome, CATEGORIAS[cat].assina, p.doc);
      });
    }
    assinatura(v.vistoriador, 'VISTORIADOR(A)');
  }

  // Cabeçalho, rodapé e rubrica em todas as páginas
  const total = doc.getNumberOfPages();
  font(8);
  const slh = 6, slw = logo ? Math.min(30, slh * logo.w / logo.h) : 0; // logo pequeno no cabeçalho (páginas 2+)
  let cab = `${TITULO_CURTO[v.tipo]} - ${enderecoCompleto(v)}`;
  while (doc.getTextWidth(cab) > CW - 25 - slw && cab.length > 10) cab = cab.slice(0, -4) + '...';
  for (let p = 1; p <= total; p++) {
    doc.setPage(p);
    font(8); doc.setTextColor(120); doc.setDrawColor(210);
    doc.text(cab, M, 10);
    const comLogo = logo && p > 1;
    if (comLogo) doc.addImage(logo.data, 'PNG', W - M - slw, 11 - slh, slw, slw * logo.h / logo.w, 'logo');
    doc.text(fmtData(v.data), W - M - (comLogo ? slw + 3 : 0), 10, { align: 'right' });
    doc.line(M, 12, W - M, 12);
    doc.line(M, H - 13, W - M, H - 13);
    doc.text(ehAvaliacao(v) ? 'Rubrica do(a) avaliador(a): ____________________' : ehOcorrencia(v) ? 'Rubrica do(a) vistoriador(a): ____________________' : 'Rubricas: ______________________________', M, H - 8);
    doc.text(`Página ${p} de ${total}`, W - M, H - 8, { align: 'right' });
    doc.setTextColor(0);
  }
  return doc;
}

// ---------- Aplicativo instalável (PWA) ----------
// O service worker guarda o aplicativo no aparelho para funcionar sem internet.
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  navigator.serviceWorker.register('sw.js').catch(err => console.warn('Service worker não registrado:', err));
}
// A sugestão de instalar só aparece na tela inicial, e nunca quando o programa já está
// rodando como aplicativo instalado ou quando o aparelho informa que ele já está instalado.
const emApp = () => matchMedia('(display-mode: standalone)').matches || matchMedia('(display-mode: window-controls-overlay)').matches || navigator.standalone === true;
const ehIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
let pedidoInstalacao = null, jaInstalado = false;
function atualizarInstalar() {
  const c = $('#card-instalar');
  if (!c) return;
  const mostrar = !emApp() && !jaInstalado && (pedidoInstalacao || ehIOS);
  c.hidden = !mostrar;
  if (!mostrar) return;
  c.innerHTML = pedidoInstalacao
    ? `<div class="row between"><div><strong>📲 Instale o aplicativo</strong><div class="muted">Ícone próprio, tela cheia e funciona sem internet.</div></div>
       <button class="btn primary" data-act="instalar">Instalar</button></div>`
    : `<strong>📲 Instale o aplicativo</strong><div class="muted">No Safari, toque em <strong>Compartilhar</strong> e depois em <strong>Adicionar à Tela de Início</strong>.</div>`;
}
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
  if (emApp()) return;
  pedidoInstalacao = e; atualizarInstalar();
});
window.addEventListener('appinstalled', () => { pedidoInstalacao = null; jaInstalado = true; atualizarInstalar(); flash('Aplicativo instalado ✓', 3000); });
if (navigator.getInstalledRelatedApps) {
  navigator.getInstalledRelatedApps().then(l => { if (l.length) { jaInstalado = true; atualizarInstalar(); } }).catch(() => {});
}

rotear();
</script>
